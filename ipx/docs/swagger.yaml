        not a list; the owner may still move the whole balance regardless of what
        a delegate holds. Only token_account's owner may approve, never an existing
        delegate, so re-delegating is not possible through this endpoint. decimals
        is checked against the mint the same way every other checked endpoint checks
        it. recent_blockhash is always required and is never fetched server-side.
        Left alone, it also builds the message and expires whenever the runtime says
        it does. Naming durable_nonce_account builds the message against the value
        that account stores instead, so the transaction never expires, and prepends
        the advance that consumes it; recent_blockhash then only prices the transaction.
        The response reports nonce_authority in that case, which has to sign as well.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Delegation parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.ApproveCheckedRequest'
      produces:
