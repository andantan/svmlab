              type: string
            type: object
      summary: Build an unsigned transaction
      tags:
      - transaction
  /svm/v2/transaction/system/allocate:
    post:
      consumes:
      - application/json
      description: 'Reserves data space on an existing System-owned account that is
        not already sized: Allocate only ever sets a size once, so an account already
        allocated is rejected regardless of the new size requested, and one that does
        not exist yet is rejected too — this endpoint sizes an account, it does not
        create one. Growing an account raises its rent-exemption floor, so the balance
        is checked against the minimum for the new size rather than the old one; rent_payer
        is always required and covers exactly that shortfall with a transfer prepended
        ahead of the allocation, even though nothing is built and rent reports zero
        when Account already holds enough. recent_blockhash is always required and
        is never fetched server-side. Left alone, it also builds the message and expires
        whenever the runtime says it does. Naming durable_nonce_account builds the
        message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well.'
      parameters:
      - description: Account, space, fee payer, and rent payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemAllocateRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemAllocateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a System Program allocation
      tags:
      - v2-transaction-system-account
  /svm/v2/transaction/system/assign:
    post:
      consumes:
      - application/json
      description: 'Hands a System-owned account to another program, which is the
        step that puts an account under a program''s control. Ownership is a field
        on the account rather than a mapping the program keeps, which is the inverse
        of an EVM contract holding balances for its users in its own storage. Account
        must already exist and already be owned by the System Program: only the current
        owner may reassign an account. The owner must be executable: only the owning
        program may debit an account or write its data, so assigning to a plain address
        locks the account and its lamports permanently. Assign itself has no notion
        of size: whether account''s byte count matches what the new owner expects
        is that program''s own concern, checked only when its initialization instruction
        runs, not here. Assign moves no lamports of its own, so fee_payer is the only
        role this endpoint charges. recent_blockhash is always required and is never
        fetched server-side. Left alone, it also builds the message and expires whenever
        the runtime says it does. Naming durable_nonce_account builds the message
        against the value that account stores instead, so the transaction never expires,
        and prepends the advance that consumes it; recent_blockhash then only prices
        the transaction. The response reports nonce_authority in that case, which
        has to sign as well.'
      parameters:
      - description: Account, new owner, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemAssignRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemAssignResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a System Program ownership assignment
      tags:
      - v2-transaction-system-account
  /svm/v2/transaction/system/create-account:
    post:
      consumes:
      - application/json
      description: 'Funds a new, zero-byte account owned by the System Program itself.
        The new account signs alongside rent_payer, which is what has no EVM counterpart:
        an address does not exist until whoever holds its private key authorizes its
        creation, and it must not already exist. rent_payer funds the creation for
        exactly the rent-exemption minimum for zero bytes — always, and only that
        amount. This endpoint only ever brings a plain account into existence, empty;
        reserving space is a separate call to allocate, which requires the account
        to already exist, handing it to another program is a separate call to assign,
        and funding it further is a separate transfer. recent_blockhash is always
        required and is never fetched server-side. Left alone, it also builds the
        message and expires whenever the runtime says it does. Naming durable_nonce_account
        builds the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well.'
      parameters:
      - description: New account, fee payer, and rent payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemCreateAccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemCreateAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a System Program account creation
      tags:
      - v2-transaction-system-account
  /svm/v2/transaction/system/nonce/advance:
    post:
      consumes:
      - application/json
      description: 'Replaces the stored nonce with the current blockhash. Advancing
        is what consumes a nonce: a transaction built against one carries it in place
        of a recent blockhash and runs this as its first instruction, so the value
        it was built for is gone by the time it finishes and it cannot land twice.
        Run on its own, this simply invalidates anything already built against the
        account. The authority signs, and the stored authority is checked here rather
        than left to fail on chain. recent_blockhash is always required and is never
        fetched server-side. Left alone, it also builds the message and expires whenever
        the runtime says it does. Naming durable_nonce_account builds the message
        against the value that account stores instead, so the transaction never expires,
        and prepends the advance that consumes it; recent_blockhash then only prices
        the transaction. The response reports nonce_authority in that case, which
        has to sign as well. It has to be an account other than nonce_account: the
        runtime refuses a transaction that advances the same nonce twice.'
      parameters:
      - description: Nonce account, authority, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemNonceAdvanceRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemNonceAdvanceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a durable nonce advance
      tags:
      - v2-transaction-system-nonce
  /svm/v2/transaction/system/nonce/authorize:
    post:
      consumes:
      - application/json
      description: 'Hands control of a nonce account to another key. The stored nonce
        and the balance are untouched, so only who may advance and withdraw changes.
        That also invalidates anything the old authority signed but never submitted,
        since such a transaction advances the nonce as its first instruction and that
        now needs a signature the old authority cannot give. If the reason for changing
        is a leaked key, the old authority''s pending transaction and this one race,
        so pair it with an advance. recent_blockhash is always required and is never
        fetched server-side. Left alone, it also builds the message and expires whenever
        the runtime says it does. Naming durable_nonce_account builds the message
        against the value that account stores instead, so the transaction never expires,
        and prepends the advance that consumes it; recent_blockhash then only prices
        the transaction. The response reports nonce_authority in that case, which
        has to sign as well. It has to be an account other than nonce_account: the
        runtime refuses a transaction that advances the same nonce twice.'
      parameters:
      - description: Nonce account, current authority, new authority, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemNonceAuthorizeRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemNonceAuthorizeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a durable nonce authority change
      tags:
      - v2-transaction-system-nonce
  /svm/v2/transaction/system/nonce/create-account:
    post:
      consumes:
      - application/json
      description: 'System CreateAccount only, sized correctly for a nonce account
        but not initialized. This is deliberately the low-level half: nothing stops
        somebody else from initializing the account first, with their own authority,
        in between this transaction and the next; a caller who wants that race closed
        should build create+initialize as two instructions in one transaction themselves.
        Initializing is a separate call: nonce/initialize. Size and funding are not
        choices: a nonce account is always exactly NonceAccountSpace bytes, and rent_payer
        funds exactly the rent-exemption minimum for that size, never more or less.
        recent_blockhash is always required and is never fetched server-side. Left
        alone, it also builds the message and expires whenever the runtime says it
        does. Naming durable_nonce_account builds the message against the value that
        account stores instead, so the transaction never expires, and prepends the
        advance that consumes it; recent_blockhash then only prices the transaction.
        The response reports nonce_authority in that case, which has to sign as well.
        It has to be an account other than new_nonce_account, which holds no nonce
        yet.'
      parameters:
      - description: New nonce account, fee payer, and rent payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemNonceCreateRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemNonceCreateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a durable nonce account creation
      tags:
      - v2-transaction-system-nonce
  /svm/v2/transaction/system/nonce/initialize:
    post:
      consumes:
      - application/json
      description: 'Initializes an account that already exists, is System-owned, and
        is already the right size. This is the natural pairing for nonce/create-account,
        which only creates the account and never initializes it; nothing stops somebody
        else from initializing it first in between with their own authority, so a
        caller who wants that race closed has to build create+initialize as two instructions
        in one transaction themselves. It is also the only path left for an address
        that can no longer be created: CreateAccount refuses one that already holds
        lamports, which is what happens when someone funds the address first. The
        account is writable but does not sign, since initializing it needs no authority
        of its own; it gains the authority named here. recent_blockhash is always
        required and is never fetched server-side. Left alone, it also builds the
        message and expires whenever the runtime says it does. Naming durable_nonce_account
        builds the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well. It has to be an account other than nonce_account,
        which holds no nonce to build against yet.'
      parameters:
      - description: Nonce account, authority, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemNonceInitializeRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemNonceInitializeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a durable nonce initialization on an existing account
      tags:
      - v2-transaction-system-nonce
  /svm/v2/transaction/system/nonce/upgrade:
    post:
      consumes:
      - application/json
      description: 'Rewrites a Legacy nonce account as the current version. Legacy
        accounts stored the blockhash itself, which could collide with a real one;
        the current version stores a value derived from it that cannot. Nothing signs,
        since this is not a privileged operation, so anyone willing to pay the fee
        may upgrade anyone''s account. No account this project creates can be upgraded:
        initialize has written the current version for a long time, only accounts
        predating that change are Legacy, and no instruction can produce one now.
        The check below rejects a current account before it reaches the chain. recent_blockhash
        is always required and is never fetched server-side. Left alone, it also builds
        the message and expires whenever the runtime says it does. Naming durable_nonce_account
        builds the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well. It has to be an account other than nonce_account,
        which is Legacy and so not something to build against.'
      parameters:
      - description: Nonce account and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemNonceUpgradeRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemNonceUpgradeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a Legacy nonce account migration
      tags:
      - v2-transaction-system-nonce
  /svm/v2/transaction/system/nonce/withdraw:
    post:
      consumes:
      - application/json
      description: 'Moves part of a nonce account''s balance out. What stays has to
        keep the account rent exempt at its size, since an account below that floor
        is subject to removal while still holding a nonce something may have been
        built against. Taking the whole balance closes the account and carries a further
        rule, so that has its own endpoint. recipient_account must already exist:
        this is a plain transfer between two accounts, not a way to bring a new one
        into existence. The authority signs, and the stored authority is checked here
        rather than left to fail on chain. recent_blockhash is always required and
        is never fetched server-side. Left alone, it also builds the message and expires
        whenever the runtime says it does. Naming durable_nonce_account builds the
        message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well. It has to be an account other than nonce_account:
        the runtime refuses a transaction that advances the same nonce twice.'
      parameters:
      - description: Nonce account, authority, recipient, lamports, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemNonceWithdrawRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemNonceWithdrawResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a partial withdrawal from a durable nonce account
      tags:
      - v2-transaction-system-nonce
  /svm/v2/transaction/system/nonce/withdraw/max:
    post:
      consumes:
      - application/json
      description: 'Takes the whole balance, which closes the account. recipient_account
        must already exist: this is a plain transfer between two accounts, not a way
        to bring a new one into existence. The rent-exempt floor that constrains a
        partial withdrawal does not apply, since nothing is left to keep exempt. One
        rule replaces it and is not checked here: the runtime refuses to close an
        account whose stored nonce is still the blockhash the transaction executes
        against, so closing in the same block the nonce was last advanced or initialized
        fails with NonceBlockhashNotExpired. That cannot be decided before submitting,
        because the blockhash it is compared against is the one at execution rather
        than any this build could see. Waiting a block and rebuilding is the fix.
        recent_blockhash is always required and is never fetched server-side. Left
        alone, it also builds the message and expires whenever the runtime says it
        does. Naming durable_nonce_account builds the message against the value that
        account stores instead, so the transaction never expires, and prepends the
        advance that consumes it; recent_blockhash then only prices the transaction.
        The response reports nonce_authority in that case, which has to sign as well.
        It has to be an account other than nonce_account.'
      parameters:
      - description: Nonce account, authority, recipient, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemNonceWithdrawMaxRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemNonceWithdrawMaxResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a full withdrawal that closes a durable nonce account
      tags:
      - v2-transaction-system-nonce
  /svm/v2/transaction/system/seed/allocate:
    post:
      consumes:
      - application/json
      description: Reserves data space on SHA256(base || seed || System Program) with
        base signing in the account's place. The account must already exist, be System-owned,
        and not already be allocated space — Allocate only ever sets a size once.
        Growing an account raises its rent-exemption floor, so the balance is checked
        against the minimum for the new size rather than the old one; rent_payer is
        always required and covers exactly that shortfall with a transfer prepended
        ahead of the allocation, even though nothing is built and rent reports zero
        when the derived account already holds enough. recent_blockhash is always
        required and is never fetched server-side. Left alone, it also builds the
        message and expires whenever the runtime says it does. Naming durable_nonce_account
        builds the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well.
      parameters:
      - description: Base, seed, space, fee payer, and rent payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemSeedAllocateRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemSeedAllocateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build an allocation on a seed-derived address
      tags:
      - v2-transaction-system-seed
  /svm/v2/transaction/system/seed/assign:
    post:
      consumes:
      - application/json
      description: 'Hands SHA256(base || seed || owner) to that same owner. There
        is no separate new-owner field, because one owner does both jobs: it is what
        the address is derived from and what the account is assigned to, so an account
        can only be handed to the program its own address already encodes. This is
        a narrow, rarely-needed tool: it only works on a derived account whose address
        was chosen for owner from the very start, brought into existence some other
        way — an account made through seed/create-account never qualifies, since that
        always derives against the System Program, and naming that here is either
        a no-op or a mismatch pointing at an unrelated address. The account must already
        exist and already be owned by the System Program: only the current owner may
        reassign an account. owner must be executable, since assigning to a plain
        address locks the account and its lamports permanently. recent_blockhash is
        always required and is never fetched server-side. Left alone, it also builds
        the message and expires whenever the runtime says it does. Naming durable_nonce_account
        builds the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well.'
      parameters:
      - description: Base, seed, owner, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemSeedAssignRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemSeedAssignResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build an ownership assignment on a seed-derived address
      tags:
      - v2-transaction-system-seed
  /svm/v2/transaction/system/seed/create-account:
    post:
      consumes:
      - application/json
      description: 'Creates a zero-byte account at SHA256(base || seed || System Program)
        and funds it for exactly the rent-exemption minimum, the same split as create-account,
        allocate, and assign for a keypair account: this endpoint only ever brings
        the derived account into existence, empty; reserving space is a separate call
        to seed/allocate, and handing it to another program is a separate call to
        seed/assign. The derived account never signs, which is the difference from
        create-account: nobody holds a secret for it, so base signs in its place and
        whoever controls base controls every address derived from it. The address
        is derived rather than accepted, since the runtime recomputes it and rejects
        a mismatch. recent_blockhash is always required and is never fetched server-side.
        Left alone, it also builds the message and expires whenever the runtime says
        it does. Naming durable_nonce_account builds the message against the value
        that account stores instead, so the transaction never expires, and prepends
        the advance that consumes it; recent_blockhash then only prices the transaction.
        The response reports nonce_authority in that case, which has to sign as well.'
      parameters:
      - description: Base, seed, fee payer, and rent payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemSeedCreateAccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemSeedCreateAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build an account creation at a seed-derived address
      tags:
      - v2-transaction-system-seed
  /svm/v2/transaction/system/seed/transfer:
    post:
      consumes:
      - application/json
      description: 'Debits SHA256(base || seed || System Program) without that account
        signing, since base signs for it. That is what makes a derived address usable
        as a holding account: anyone can fund it, and only the holder of base can
        spend it. The account must still be System-owned for a system transfer to
        debit it, and recipient_account must already exist: this is a plain transfer
        between two accounts, not a way to bring a new one into existence. recent_blockhash
        is always required and is never fetched server-side. Left alone, it also builds
        the message and expires whenever the runtime says it does. Naming durable_nonce_account
        builds the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well.'
      parameters:
      - description: Base, seed, recipient, lamports, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemSeedTransferRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemSeedTransferResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a transfer out of a seed-derived address
      tags:
      - v2-transaction-system-seed
  /svm/v2/transaction/system/seed/transfer/max:
    post:
      consumes:
      - application/json
      description: 'Sends everything SHA256(base || seed || System Program) holds.
        The amount is the whole balance with nothing held back, because a derived
        address can never pay the fee: a fee payer has to sign, and this account cannot.
        That also means no probe is needed to price the message first, since the amount
        does not depend on the fee here the way it does for a plain transfer. Emptying
        the account lets the runtime reclaim it. recipient_account must already exist:
        this is a plain transfer between two accounts, not a way to bring a new one
        into existence. recent_blockhash is always required and is never fetched server-side.
        Left alone, it also builds the message and expires whenever the runtime says
        it does. Naming durable_nonce_account builds the message against the value
        that account stores instead, so the transaction never expires, and prepends
        the advance that consumes it; recent_blockhash then only prices the transaction.
        The response reports nonce_authority in that case, which has to sign as well.'
      parameters:
      - description: Base, seed, recipient, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemSeedTransferMaxRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemSeedTransferMaxResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a transfer of a seed-derived address's entire balance
      tags:
      - v2-transaction-system-seed
  /svm/v2/transaction/system/transfer:
    post:
      consumes:
      - application/json
      description: 'Assembles a System Program transfer between two existing accounts
        and returns the same shape as a v1 build, so sign and send accept it unchanged.
        recipient_account must already exist: this is a plain balance transfer, not
        a way to bring a new account into existence. recent_blockhash is always required
        and is never fetched server-side. Left alone, it also builds the message and
        expires whenever the runtime says it does. Naming durable_nonce_account builds
        the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it as the first instruction;
        recent_blockhash then only prices the transaction, since a nonce is never
        among the cluster''s recent blockhashes. The response reports nonce_authority
        in that case, which has to sign as well. To send the sender''s entire balance,
        use transfer/max instead.'
      parameters:
      - description: Funding payer, recipient, and lamports
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemTransferRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemTransferResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a native SOL transfer
      tags:
      - v2-transaction-system-transfer
  /svm/v2/transaction/system/transfer/collect:
    post:
      consumes:
      - application/json
      description: 'Assembles one Transfer instruction per source, all landing on
        the same account that already exists, in a single transaction — the inverse
        of transfer/spread. Unlike spread, this is a multi-party transaction: each
        source signs only for its own instruction, so as many signatures are required
        as sources named, plus fee_payer. A source may set max instead of lamports
        to sweep its entire balance; if that source is also fee_payer, the fee comes
        out of the same sweep first, exactly as transfer/max handles the same overlap.
        This is bounded by transaction size rather than by anything it checks: a transaction
        travels in one 1232-byte packet and cannot be split, which caps the source
        list somewhere around twenty and is reported as size and size_limit. recent_blockhash
        is always required and is never fetched server-side. Left alone, it also builds
        the message and expires whenever the runtime says it does. Naming durable_nonce_account
        builds the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it as the first instruction;
        recent_blockhash then only prices the transaction. The response reports nonce_authority
        in that case, which has to sign as well.'
      parameters:
      - description: Recipient, transfers with amounts or max, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemTransferCollectRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
