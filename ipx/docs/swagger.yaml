  /svm/sign:
    post:
      consumes:
      - application/json
      description: 'Signs the given bytes with a key resolved from config.yaml and
        returns the bare signature, assembling nothing around it. The input is the
        message itself, not a digest: ed25519 hashes internally, so a pre-hashed input
        yields a signature no verifier holding the real message can check. Pass the
        message field a build returns to reproduce what the transaction signer does.'
      parameters:
      - description: Signer public key and message
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.SignRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.SignResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sign arbitrary bytes
      tags:
      - sign
  /svm/sign/transaction:
    post:
      consumes:
      - application/json
      description: 'Signs the message inside a serialized transaction and writes each
        signature into its signer''s slot, found from the key rather than from the
        order given. transaction is base64. The message is never rebuilt, so the bytes
        a caller signs are exactly the bytes they were given. A versioned (v0) message
        is accepted and signed without being parsed: a signer must be one of its leading
        static keys, since an address lookup table entry can never sign, so locating
        a slot needs no address table lookups. The response is thinner for one, since
        nothing here reads what the transaction does. public_keys are resolved from
        config.yaml and private_keys carry the secret directly, for a signer such
        as a newly created account that is not registered; the two may be mixed in
        one call. Keys may also be named across several calls, so co-signers can complete
        a transaction one at a time.'
      parameters:
      - description: Transaction and its signers
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.SignTransactionRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.SignTransactionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sign a serialized transaction
      tags:
      - sign
  /svm/sign/verify:
    post:
      consumes:
      - application/json
      description: Checks a signature against a message and a public key. The key
        is required and cannot be recovered from the signature, since ed25519 offers
        no equivalent of ecrecover. Any key may be given, not only one from config.
      parameters:
      - description: Public key, message, and signature
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.VerifyRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.VerifyResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify a signature
      tags:
      - sign
  /svm/token/account:
    post:
      consumes:
      - application/json
      description: 'Parses the 165 bytes a token account holds. owner is not the runtime
        owner: that is the token program, which is what may write the data, while
        owner here is the wallet whose signature the program accepts. amount is base
        units with no scale of its own, so the mint is read as well to report amount_ui;
        when the mint cannot be read the base units are still returned and decimals
        is omitted rather than guessed. Works for both classic Token and Token-2022,
        whose extensions sit past the base layout.'
      parameters:
      - description: Token account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/token.AccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/token.AccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read an SPL Token holder account
      tags:
      - token
  /svm/token/amount-to-ui:
    post:
      consumes:
      - application/json
      description: 'Builds AmountToUiAmount and simulates it — never sends it, since
        it writes nothing. In this version of the program a mint can only specify
        decimals, so against a plain mint this is exactly amount / 10^decimals and
        could be computed without the network at all; it earns its keep only against
        a Token-2022 mint carrying the interest-bearing extension, where the true
        UI string includes interest accrued since the mint''s last update and only
        the program can compute that. fee_payer is required even though nothing is
        ever sent: the node still checks the simulated payer can afford the fee before
        running the instruction.'
      parameters:
      - description: Mint, raw amount, fee payer, and program
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/token.AmountToUiRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/token.AmountToUiResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Format a raw token amount as a UI string, using the mint's own program
      tags:
      - token
  /svm/token/ata/derive:
    post:
      consumes:
      - application/json
      description: 'Returns the address create-ata and create-ata-idempotent will
        create and everything else in this API that takes owner + mint derives internally,
        plus the canonical bump: PDA.Find always searches from 255 downward and stops
        at the first off-curve point, which is not a choice — the Associated Token
        Account program recomputes and validates that same bump internally and accepts
        no other. This is a pure computation, not a chain read: it never checks whether
        the derived address actually exists.'
      parameters:
      - description: Owner, mint, and program
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/token.ATADeriveRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/token.ATADeriveResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Derive the canonical associated token account for a wallet and mint
      tags:
      - token
  /svm/token/ata/validate:
    post:
      consumes:
      - application/json
      description: Recomputes the associated token account for owner, mint, and program
        the same way ata/derive does, and compares it against associated_token_account.
        valid is true only when the two match exactly; derived is always returned
        so a caller who gets false back knows the right address without a second call.
        Like ata/derive, this never checks whether either address actually exists
        on chain — it is purely a derivation check.
      parameters:
      - description: Owner, mint, program, and the address to check
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/token.ATAValidateRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/token.ATAValidateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check a supplied address against the canonical associated token account
      tags:
      - token
  /svm/token/mint:
    post:
      consumes:
      - application/json
      description: 'Parses the 82 bytes a mint account holds. A mint is the closest
        thing Solana has to an ERC-20 contract, and what it lacks is the point: no
        balances and no allowances, since those live in separate token accounts owned
        by each holder. mint_authority and freeze_authority are omitted when absent,
        which is different from being the zero address; a mint whose mint authority
        was removed has a permanently fixed supply, and one initialized without a
        freeze authority can never gain one. Works for both classic Token and Token-2022,
        whose extensions sit past the base layout.'
      parameters:
      - description: Mint account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/token.MintRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/token.MintResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read an SPL Token mint
      tags:
      - token
  /svm/token/ui-to-amount:
    post:
      consumes:
      - application/json
      description: 'Builds UiAmountToAmount and simulates it — never sends it, since
        it writes nothing. AmountToUi''s inverse, for the same reason: against a plain
        mint this is a decimals multiply a client could do itself, and it earns its
        keep only against a Token-2022 mint carrying the interest-bearing extension.
        fee_payer is required even though nothing is ever sent: the node still checks
        the simulated payer can afford the fee before running the instruction.'
      parameters:
      - description: Mint, UI amount string, fee payer, and program
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/token.UiToAmountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/token.UiToAmountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Parse a UI amount string back into a raw token amount, using the mint's
        own program
      tags:
      - token
