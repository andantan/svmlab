  api_handler_token.MintResponse:
    properties:
      decimals:
        type: integer
      exists:
        type: boolean
      freezable:
        type: boolean
      freeze_authority:
        type: string
      initialized:
        type: boolean
      mint_authority:
        type: string
      mintable:
        type: boolean
      program:
        type: string
      public_key:
        type: string
      supply:
        type: string
      supply_ui:
        type: string
    type: object
  api_handler_v1.Account:
    properties:
      is_signer:
        example: true
        type: boolean
      is_writable:
        example: true
        type: boolean
      public_key:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
    type: object
  api_handler_v1.BuildTransactionRequest:
    properties:
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      instructions:
        items:
          $ref: '#/definitions/api_handler_v1.Instruction'
        type: array
      recent_blockhash:
        description: |-
          RecentBlockhash may be left empty, in which case it is fetched from the
          cluster. Supplying it makes the call deterministic, which is what allows
          the same request to reproduce identical bytes.
        example: ""
        type: string
    type: object
  api_handler_v1.BuildTransactionResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      header:
        $ref: '#/definitions/api_handler_v1.Header'
      message:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      size:
        type: integer
      transaction:
        type: string
    type: object
  api_handler_v1.Header:
    properties:
      num_readonly_signed_accounts:
        type: integer
      num_readonly_unsigned_accounts:
        type: integer
      num_required_signatures:
        type: integer
    type: object
  api_handler_v1.Instruction:
    properties:
      accounts:
        items:
          $ref: '#/definitions/api_handler_v1.Account'
        type: array
      data:
        example: AgAAAECcAAAAAAAA
        type: string
      program_id:
        example: "11111111111111111111111111111111"
        type: string
    type: object
  api_handler_v2.ApproveCheckedRequest:
    properties:
      account:
        example: ""
        type: string
      amount:
        example: "500000"
        type: string
      authority:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      decimals:
        example: 6
        type: integer
      delegate:
        example: ""
        type: string
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      mint:
        example: ""
        type: string
      multisig_signers:
        description: |-
          MultisigSigners is empty for a single-signer authority. Non-empty, the
          authority itself does not sign; the named members do, in its place.
        items:
          type: string
        type: array
      nonce_account:
        example: ""
        type: string
      program:
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
    type: object
  api_handler_v2.ApproveCheckedResponse:
    properties:
      account:
        type: string
      account_keys:
        items:
          type: string
        type: array
      amount:
        type: string
      authority:
        type: string
      decimals:
        type: integer
      delegate:
        type: string
      fee:
        type: string
      message:
        type: string
      mint:
        type: string
      nonce_authority:
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
  api_handler_v2.BurnCheckedRequest:
    properties:
      account:
        example: ""
        type: string
      amount:
        example: "1000"
        type: string
      authority:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      decimals:
        example: 6
        type: integer
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      mint:
        example: ""
        type: string
      multisig_signers:
        description: |-
          MultisigSigners is empty for a single-signer authority. Non-empty, the
          authority itself does not sign; the named members do, in its place.
        items:
          type: string
        type: array
      nonce_account:
        example: ""
        type: string
      program:
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
    type: object
  api_handler_v2.BurnCheckedResponse:
    properties:
      account:
        type: string
      account_keys:
        items:
          type: string
        type: array
      amount:
        type: string
      authority:
        type: string
      decimals:
        type: integer
      fee:
        type: string
      message:
        type: string
      mint:
        type: string
      nonce_authority:
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
  api_handler_v2.CloseAccountRequest:
    properties:
      account:
        example: ""
        type: string
      authority:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      destination:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      multisig_signers:
        description: |-
          MultisigSigners is empty for a single-signer authority. Non-empty, the
          authority itself does not sign; the named members do, in its place.
        items:
          type: string
        type: array
      nonce_account:
        example: ""
        type: string
      program:
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
    type: object
  api_handler_v2.CloseAccountResponse:
    properties:
      account:
        type: string
      account_keys:
        items:
          type: string
        type: array
      authority:
        type: string
      destination:
        type: string
      fee:
        type: string
      message:
        type: string
      nonce_authority:
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      reclaimed_lamports:
        description: |-
          ReclaimedLamports is the account's balance at the moment it was read,
          which is what closing hands to destination. It can change between this
          response and the transaction landing if anything else touches the
          account first.
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
  api_handler_v2.CreateATAIdempotentRequest:
    properties:
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      mint:
        example: ""
        type: string
      nonce_account:
        example: ""
        type: string
      program:
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
      rent_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      wallet:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
    type: object
  api_handler_v2.CreateATAIdempotentResponse:
    properties:
      account:
        type: string
      account_keys:
        items:
          type: string
        type: array
      bump:
        type: integer
      fee:
        type: string
      message:
        type: string
      mint:
        type: string
      nonce_authority:
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      rent_exempt:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
      wallet:
        type: string
    type: object
  api_handler_v2.CreateATARequest:
    properties:
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      mint:
        example: ""
        type: string
      nonce_account:
        example: ""
        type: string
      program:
        description: |-
          Program is a seed of the derived address, not only the program the
          account belongs to, so one wallet has a different associated account
          for classic Token than for Token-2022 over the same mint.
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
      rent_payer:
        description: |-
          RentPayer covers the rent-exemption deposit, distinct from FeePayer:
          the two are separate balances to check, and a caller funding somebody
          else's associated account pays this one without necessarily paying the
          transaction fee.
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      wallet:
        description: |-
          Wallet is who ends up owning the account, which need not be RentPayer.
          Funding somebody else's associated account is ordinary: the address is
          theirs either way.
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
    type: object
  api_handler_v2.CreateATAResponse:
    properties:
      account:
        type: string
      account_keys:
        items:
          type: string
        type: array
      bump:
        type: integer
      fee:
        type: string
      message:
        type: string
      mint:
        type: string
      nonce_authority:
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      rent_exempt:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
      wallet:
        type: string
    type: object
  api_handler_v2.CreateAccountRequest:
    properties:
      account:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      from:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
