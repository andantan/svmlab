        items:
          type: string
        type: array
      derived_address:
        type: string
      fee:
        type: string
      message:
        type: string
      recent_blockhash:
        type: string
      rent_exempt:
        type: string
      signers:
        items:
          type: string
        type: array
      space:
        type: integer
      transaction:
        type: string
    type: object
  v2.SystemSeedAssignRequest:
    properties:
      base:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      owner:
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
      seed:
        example: vault-1
        type: string
    type: object
  v2.SystemSeedAssignResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      derived_address:
        type: string
      fee:
        type: string
      message:
        type: string
      owner:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
  v2.SystemSeedCreateAccountRequest:
    properties:
      base:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      from:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      lamports:
        example: "890880"
        type: string
      owner:
        example: "11111111111111111111111111111111"
        type: string
      seed:
        example: vault-1
        type: string
      space:
        example: "0"
        type: string
    type: object
  v2.SystemSeedCreateAccountResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      derived_address:
        description: |-
          DerivedAddress is what base, seed, and owner produce. It is the account
          being created, and it is absent from signers because nobody holds a
          secret for it.
        type: string
      fee:
        type: string
      lamports:
        type: string
      lamports_sol:
        type: string
      message:
        type: string
      owner:
        type: string
      recent_blockhash:
        type: string
      rent_exempt:
        type: string
      signers:
        items:
          type: string
        type: array
      space:
        type: integer
      transaction:
        type: string
    type: object
  v2.SystemSeedTransferMaxRequest:
    properties:
      base:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      owner:
        example: "11111111111111111111111111111111"
        type: string
      seed:
        example: vault-1
        type: string
      to:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
