              type: string
            type: object
      summary: Build an unsigned transaction
      tags:
      - transaction
  /svm/v2/transaction/system/allocate:
    post:
      consumes:
      - application/json
      description: 'Reserves data space on an existing System-owned account that is
        not already sized: Allocate only ever sets a size once, so an account already
        allocated is rejected regardless of the new size requested, and one that does
        not exist yet is rejected too — this endpoint sizes an account, it does not
        create one. Growing an account raises its rent-exemption floor, so the balance
        is checked against the minimum for the new size rather than the old one; rent_payer
        is always required and covers exactly that shortfall with a transfer prepended
        ahead of the allocation, even though nothing is built and rent reports zero
        when Account already holds enough. recent_blockhash is always required and
        is never fetched server-side. Left alone, it also builds the message and expires
        whenever the runtime says it does. Naming durable_nonce_account builds the
        message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well.'
      parameters:
      - description: Account, space, fee payer, and rent payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemAllocateRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemAllocateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a System Program allocation
      tags:
      - v2-transaction-system-account
  /svm/v2/transaction/system/assign:
    post:
      consumes:
      - application/json
      description: 'Hands a System-owned account to another program, which is the
        step that puts an account under a program''s control. Ownership is a field
        on the account rather than a mapping the program keeps, which is the inverse
        of an EVM contract holding balances for its users in its own storage. Account
        must already exist and already be owned by the System Program: only the current
        owner may reassign an account. The owner must be executable: only the owning
        program may debit an account or write its data, so assigning to a plain address
        locks the account and its lamports permanently. Assign itself has no notion
        of size: whether account''s byte count matches what the new owner expects
        is that program''s own concern, checked only when its initialization instruction
        runs, not here. Assign moves no lamports of its own, so fee_payer is the only
        role this endpoint charges. recent_blockhash is always required and is never
        fetched server-side. Left alone, it also builds the message and expires whenever
        the runtime says it does. Naming durable_nonce_account builds the message
        against the value that account stores instead, so the transaction never expires,
        and prepends the advance that consumes it; recent_blockhash then only prices
        the transaction. The response reports nonce_authority in that case, which
        has to sign as well.'
      parameters:
      - description: Account, new owner, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemAssignRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemAssignResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a System Program ownership assignment
      tags:
      - v2-transaction-system-account
  /svm/v2/transaction/system/create-account:
    post:
      consumes:
      - application/json
      description: 'Funds a new, zero-byte account owned by the System Program itself.
        The new account signs alongside rent_payer, which is what has no EVM counterpart:
        an address does not exist until whoever holds its private key authorizes its
        creation, and it must not already exist. rent_payer funds the creation for
        exactly the rent-exemption minimum for zero bytes — always, and only that
        amount. This endpoint only ever brings a plain account into existence, empty;
        reserving space is a separate call to allocate, which requires the account
        to already exist, handing it to another program is a separate call to assign,
        and funding it further is a separate transfer. recent_blockhash is always
        required and is never fetched server-side. Left alone, it also builds the
        message and expires whenever the runtime says it does. Naming durable_nonce_account
        builds the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well.'
      parameters:
      - description: New account, fee payer, and rent payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemCreateAccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemCreateAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a System Program account creation
      tags:
      - v2-transaction-system-account
  /svm/v2/transaction/system/nonce/advance:
    post:
      consumes:
      - application/json
      description: 'Replaces the stored nonce with the current blockhash. Advancing
        is what consumes a nonce: a transaction built against one carries it in place
        of a recent blockhash and runs this as its first instruction, so the value
        it was built for is gone by the time it finishes and it cannot land twice.
        Run on its own, this simply invalidates anything already built against the
        account. The authority signs, and the stored authority is checked here rather
        than left to fail on chain. recent_blockhash is always required and is never
        fetched server-side. Left alone, it also builds the message and expires whenever
        the runtime says it does. Naming durable_nonce_account builds the message
        against the value that account stores instead, so the transaction never expires,
        and prepends the advance that consumes it; recent_blockhash then only prices
        the transaction. The response reports nonce_authority in that case, which
        has to sign as well. It has to be an account other than nonce_account: the
        runtime refuses a transaction that advances the same nonce twice.'
      parameters:
      - description: Nonce account, authority, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemNonceAdvanceRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemNonceAdvanceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a durable nonce advance
      tags:
      - v2-transaction-system-nonce
  /svm/v2/transaction/system/nonce/authorize:
    post:
      consumes:
      - application/json
      description: 'Hands control of a nonce account to another key. The stored nonce
        and the balance are untouched, so only who may advance and withdraw changes.
        That also invalidates anything the old authority signed but never submitted,
        since such a transaction advances the nonce as its first instruction and that
        now needs a signature the old authority cannot give. If the reason for changing
        is a leaked key, the old authority''s pending transaction and this one race,
        so pair it with an advance. recent_blockhash is always required and is never
        fetched server-side. Left alone, it also builds the message and expires whenever
        the runtime says it does. Naming durable_nonce_account builds the message
        against the value that account stores instead, so the transaction never expires,
        and prepends the advance that consumes it; recent_blockhash then only prices
        the transaction. The response reports nonce_authority in that case, which
        has to sign as well. It has to be an account other than nonce_account: the
        runtime refuses a transaction that advances the same nonce twice.'
      parameters:
      - description: Nonce account, current authority, new authority, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemNonceAuthorizeRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemNonceAuthorizeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a durable nonce authority change
      tags:
      - v2-transaction-system-nonce
  /svm/v2/transaction/system/nonce/create-account:
    post:
      consumes:
      - application/json
      description: 'Creates the account and initializes it as a durable nonce in one
        transaction. The nonce account appears twice: it signs for the creation, since
        an address does not exist until its key authorizes it, and is only writable
        for the initialization, which needs no authority of its own — it gains the
        one named here. Message compilation lists it once with the union of both,
        which is why it shows up among the signers. Size and funding are not choices:
        a nonce account is always exactly NonceAccountSpace bytes, and rent_payer
        funds exactly the rent-exemption minimum for that size, never more or less.
        recent_blockhash is always required and is never fetched server-side. Left
        alone, it also builds the message and expires whenever the runtime says it
        does. Naming durable_nonce_account builds the message against the value that
        account stores instead, so the transaction never expires, and prepends the
        advance that consumes it; recent_blockhash then only prices the transaction.
        The response reports nonce_authority in that case, which has to sign as well.
        It has to be an account other than new_nonce_account, which holds no nonce
        yet.'
      parameters:
      - description: New nonce account, authority, fee payer, and rent payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemNonceCreateRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemNonceCreateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a durable nonce account creation
      tags:
      - v2-transaction-system-nonce
  /svm/v2/transaction/system/nonce/initialize:
    post:
      consumes:
      - application/json
      description: 'Initializes an account that already exists, is System-owned, and
        is already the right size. nonce/create-account does this and the creation
        together, so this is for an address that can no longer be created: CreateAccount
        refuses one that already holds lamports, which is what happens when someone
        funds the address first. The account is writable but does not sign, since
        initializing it needs no authority of its own; it gains the authority named
        here. recent_blockhash is always required and is never fetched server-side.
        Left alone, it also builds the message and expires whenever the runtime says
        it does. Naming durable_nonce_account builds the message against the value
        that account stores instead, so the transaction never expires, and prepends
        the advance that consumes it; recent_blockhash then only prices the transaction.
        The response reports nonce_authority in that case, which has to sign as well.
        It has to be an account other than nonce_account, which holds no nonce to
        build against yet.'
      parameters:
      - description: Nonce account, authority, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemNonceInitializeRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemNonceInitializeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a durable nonce initialization on an existing account
      tags:
      - v2-transaction-system-nonce
  /svm/v2/transaction/system/nonce/upgrade:
    post:
      consumes:
      - application/json
      description: 'Rewrites a Legacy nonce account as the current version. Legacy
        accounts stored the blockhash itself, which could collide with a real one;
        the current version stores a value derived from it that cannot. Nothing signs,
        since this is not a privileged operation, so anyone willing to pay the fee
        may upgrade anyone''s account. No account this project creates can be upgraded:
        initialize has written the current version for a long time, only accounts
        predating that change are Legacy, and no instruction can produce one now.
        The check below rejects a current account before it reaches the chain. recent_blockhash
        is always required and is never fetched server-side. Left alone, it also builds
        the message and expires whenever the runtime says it does. Naming durable_nonce_account
        builds the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well. It has to be an account other than nonce_account,
        which is Legacy and so not something to build against.'
      parameters:
      - description: Nonce account and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemNonceUpgradeRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemNonceUpgradeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a Legacy nonce account migration
      tags:
      - v2-transaction-system-nonce
  /svm/v2/transaction/system/nonce/withdraw:
    post:
      consumes:
      - application/json
      description: 'Moves part of a nonce account''s balance out. What stays has to
        keep the account rent exempt at its size, since an account below that floor
        is subject to removal while still holding a nonce something may have been
        built against. Taking the whole balance closes the account and carries a further
        rule, so that has its own endpoint. recipient_account must already exist:
        this is a plain transfer between two accounts, not a way to bring a new one
        into existence. The authority signs, and the stored authority is checked here
        rather than left to fail on chain. recent_blockhash is always required and
        is never fetched server-side. Left alone, it also builds the message and expires
        whenever the runtime says it does. Naming durable_nonce_account builds the
        message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well. It has to be an account other than nonce_account:
        the runtime refuses a transaction that advances the same nonce twice.'
      parameters:
      - description: Nonce account, authority, recipient, lamports, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemNonceWithdrawRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemNonceWithdrawResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a partial withdrawal from a durable nonce account
      tags:
      - v2-transaction-system-nonce
  /svm/v2/transaction/system/nonce/withdraw/max:
    post:
      consumes:
      - application/json
      description: 'Takes the whole balance, which closes the account. recipient_account
        must already exist: this is a plain transfer between two accounts, not a way
        to bring a new one into existence. The rent-exempt floor that constrains a
        partial withdrawal does not apply, since nothing is left to keep exempt. One
        rule replaces it and is not checked here: the runtime refuses to close an
        account whose stored nonce is still the blockhash the transaction executes
        against, so closing in the same block the nonce was last advanced or initialized
        fails with NonceBlockhashNotExpired. That cannot be decided before submitting,
        because the blockhash it is compared against is the one at execution rather
        than any this build could see. Waiting a block and rebuilding is the fix.
        recent_blockhash is always required and is never fetched server-side. Left
        alone, it also builds the message and expires whenever the runtime says it
        does. Naming durable_nonce_account builds the message against the value that
        account stores instead, so the transaction never expires, and prepends the
        advance that consumes it; recent_blockhash then only prices the transaction.
        The response reports nonce_authority in that case, which has to sign as well.
        It has to be an account other than nonce_account.'
      parameters:
      - description: Nonce account, authority, recipient, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemNonceWithdrawMaxRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemNonceWithdrawMaxResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a full withdrawal that closes a durable nonce account
      tags:
      - v2-transaction-system-nonce
  /svm/v2/transaction/system/seed/allocate:
    post:
      consumes:
      - application/json
      description: Reserves data space on SHA256(base || seed || System Program) with
        base signing in the account's place. The account must already exist, be System-owned,
        and not already be allocated space — Allocate only ever sets a size once.
        Growing an account raises its rent-exemption floor, so the balance is checked
        against the minimum for the new size rather than the old one; rent_payer is
        always required and covers exactly that shortfall with a transfer prepended
        ahead of the allocation, even though nothing is built and rent reports zero
        when the derived account already holds enough. recent_blockhash is always
        required and is never fetched server-side. Left alone, it also builds the
        message and expires whenever the runtime says it does. Naming durable_nonce_account
        builds the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well.
      parameters:
      - description: Base, seed, space, fee payer, and rent payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemSeedAllocateRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemSeedAllocateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build an allocation on a seed-derived address
      tags:
      - v2-transaction-system-seed
  /svm/v2/transaction/system/seed/assign:
    post:
      consumes:
      - application/json
      description: 'Hands SHA256(base || seed || owner) to that same owner. There
        is no separate new-owner field, because one owner does both jobs: it is what
        the address is derived from and what the account is assigned to, so an account
        can only be handed to the program its own address already encodes. This is
        a narrow, rarely-needed tool: it only works on a derived account whose address
        was chosen for owner from the very start, brought into existence some other
        way — an account made through seed/create-account never qualifies, since that
        always derives against the System Program, and naming that here is either
        a no-op or a mismatch pointing at an unrelated address. The account must already
        exist and already be owned by the System Program: only the current owner may
        reassign an account. owner must be executable, since assigning to a plain
        address locks the account and its lamports permanently. recent_blockhash is
        always required and is never fetched server-side. Left alone, it also builds
        the message and expires whenever the runtime says it does. Naming durable_nonce_account
        builds the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well.'
      parameters:
      - description: Base, seed, owner, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemSeedAssignRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemSeedAssignResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build an ownership assignment on a seed-derived address
      tags:
      - v2-transaction-system-seed
  /svm/v2/transaction/system/seed/create-account:
    post:
      consumes:
      - application/json
      description: 'Creates a zero-byte account at SHA256(base || seed || System Program)
        and funds it for exactly the rent-exemption minimum, the same split as create-account,
        allocate, and assign for a keypair account: this endpoint only ever brings
        the derived account into existence, empty; reserving space is a separate call
        to seed/allocate, and handing it to another program is a separate call to
        seed/assign. The derived account never signs, which is the difference from
        create-account: nobody holds a secret for it, so base signs in its place and
        whoever controls base controls every address derived from it. The address
        is derived rather than accepted, since the runtime recomputes it and rejects
        a mismatch. recent_blockhash is always required and is never fetched server-side.
        Left alone, it also builds the message and expires whenever the runtime says
        it does. Naming durable_nonce_account builds the message against the value
        that account stores instead, so the transaction never expires, and prepends
        the advance that consumes it; recent_blockhash then only prices the transaction.
        The response reports nonce_authority in that case, which has to sign as well.'
      parameters:
      - description: Base, seed, fee payer, and rent payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemSeedCreateAccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemSeedCreateAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build an account creation at a seed-derived address
      tags:
      - v2-transaction-system-seed
  /svm/v2/transaction/system/seed/transfer:
    post:
      consumes:
      - application/json
      description: 'Debits SHA256(base || seed || System Program) without that account
        signing, since base signs for it. That is what makes a derived address usable
        as a holding account: anyone can fund it, and only the holder of base can
        spend it. The account must still be System-owned for a system transfer to
        debit it, and recipient_account must already exist: this is a plain transfer
        between two accounts, not a way to bring a new one into existence. recent_blockhash
        is always required and is never fetched server-side. Left alone, it also builds
        the message and expires whenever the runtime says it does. Naming durable_nonce_account
        builds the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well.'
      parameters:
      - description: Base, seed, recipient, lamports, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemSeedTransferRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemSeedTransferResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a transfer out of a seed-derived address
      tags:
      - v2-transaction-system-seed
  /svm/v2/transaction/system/seed/transfer/max:
    post:
      consumes:
      - application/json
      description: 'Sends everything SHA256(base || seed || System Program) holds.
        The amount is the whole balance with nothing held back, because a derived
        address can never pay the fee: a fee payer has to sign, and this account cannot.
        That also means no probe is needed to price the message first, since the amount
        does not depend on the fee here the way it does for a plain transfer. Emptying
        the account lets the runtime reclaim it. recipient_account must already exist:
        this is a plain transfer between two accounts, not a way to bring a new one
        into existence. recent_blockhash is always required and is never fetched server-side.
        Left alone, it also builds the message and expires whenever the runtime says
        it does. Naming durable_nonce_account builds the message against the value
        that account stores instead, so the transaction never expires, and prepends
        the advance that consumes it; recent_blockhash then only prices the transaction.
        The response reports nonce_authority in that case, which has to sign as well.'
      parameters:
      - description: Base, seed, recipient, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemSeedTransferMaxRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemSeedTransferMaxResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a transfer of a seed-derived address's entire balance
      tags:
      - v2-transaction-system-seed
  /svm/v2/transaction/system/transfer:
    post:
      consumes:
      - application/json
      description: 'Assembles a System Program transfer between two existing accounts
        and returns the same shape as a v1 build, so sign and send accept it unchanged.
        recipient_account must already exist: this is a plain balance transfer, not
        a way to bring a new account into existence. recent_blockhash is always required
        and is never fetched server-side. Left alone, it also builds the message and
        expires whenever the runtime says it does. Naming durable_nonce_account builds
        the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it as the first instruction;
        recent_blockhash then only prices the transaction, since a nonce is never
        among the cluster''s recent blockhashes. The response reports nonce_authority
        in that case, which has to sign as well. To send the sender''s entire balance,
        use transfer/max instead.'
      parameters:
      - description: Funding payer, recipient, and lamports
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemTransferRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemTransferResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a native SOL transfer
      tags:
      - v2-transaction-system-transfer
  /svm/v2/transaction/system/transfer/max:
    post:
      consumes:
      - application/json
      description: 'Assembles a System Program transfer moving everything the sender
        can send, between two existing accounts. Resolving that amount needs the sender''s
        balance and the fee, both fetched from the chain. The fee only comes out of
        the sender''s balance when the sender is also the fee payer; with a separate
        fee payer the whole balance can go, which empties the account and lets the
        runtime reclaim it. recipient_account must already exist: this is a plain
        balance transfer, not a way to bring a new account into existence. recent_blockhash
        is always required and is never fetched server-side. Left alone, it also builds
        the message and expires whenever the runtime says it does. Naming durable_nonce_account
        builds the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it as the first instruction;
        recent_blockhash then only prices the transaction, since a nonce is never
        among the cluster''s recent blockhashes. The response reports nonce_authority
        in that case, which has to sign as well.'
      parameters:
      - description: Funding payer and recipient
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemTransferMaxRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemTransferMaxResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a native SOL transfer of the sender's entire balance
      tags:
      - v2-transaction-system-transfer
  /svm/v2/transaction/system/transfer/spread:
    post:
      consumes:
      - application/json
      description: 'Assembles one Transfer instruction per recipient, all leaving
        the same account and all landing on accounts that already exist, in a single
        transaction. This is the first endpoint to carry an arbitrary number of instructions,
        so it is the first bounded by transaction size rather than by anything it
        checks: a transaction travels in one 1232-byte packet and cannot be split,
        which caps the list somewhere around twenty and is reported as size and size_limit.
        The account keys show fewer entries than instructions, since the sender and
        the System Program appear in every one and a compiled message lists each key
        once. There is no max variant, because sending everything one account holds
        does not say how to divide it. recent_blockhash is always required and is
        never fetched server-side. Left alone, it also builds the message and expires
        whenever the runtime says it does. Naming durable_nonce_account builds the
        message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it as the first instruction;
        recent_blockhash then only prices the transaction, since a nonce is never
        among the cluster''s recent blockhashes. The response reports nonce_authority
        in that case, which has to sign as well.'
      parameters:
      - description: Funding payer, recipients with amounts, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SystemTransferSpreadRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SystemTransferSpreadResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build one transaction paying several recipients
      tags:
      - v2-transaction-system-transfer
  /svm/v2/transaction/token/approve-checked:
    post:
      consumes:
      - application/json
      description: Authorizes delegate to move up to amount from account, on the account
        owner's behalf. A second approve replaces the delegation entirely rather than
        adding to it, since the program stores one delegate and one amount, not a
        list; the owner may still move the whole balance regardless of what a delegate
        holds. Only the account's owner may approve, never an existing delegate, so
        re-delegating is not possible through this endpoint. decimals is checked against
        the mint the same way every other checked endpoint checks it.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Delegation parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.ApproveCheckedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.ApproveCheckedResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Grant a delegate limited spending rights over a token account
      tags:
      - transaction
  /svm/v2/transaction/token/burn-checked:
    post:
      consumes:
      - application/json
      description: Reduces the mint's total supply and the account's balance together.
        decimals is checked against the mint rather than filled in from it, catching
        a client that formatted amount against the wrong decimals as a 400 instead
        of an on-chain failure. authority must be the account's owner, or its delegate
        for no more than the delegated amount — the mint's own authority has no say
        over what a holder chooses to burn.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Burn parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.BurnCheckedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.BurnCheckedResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Destroy supply held by a token account
      tags:
      - transaction
  /svm/v2/transaction/token/close-account:
    post:
      consumes:
      - application/json
      description: The account must already hold no tokens; the balance is not swept,
        it has to be zero. A wrapped SOL account is the exception, since its lamports
        are its balance, and closing it is how SOL is unwrapped. authority must be
        the account's owner or its close authority. The reclaimed lamports go to destination.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Close parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.CloseAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.CloseAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Close a token account and reclaim its rent
      tags:
      - transaction
  /svm/v2/transaction/token/create-account:
    post:
      consumes:
      - application/json
      description: System CreateAccount and InitializeAccount3 as one transaction.
        An uninitialized Token-owned account initialized by somebody else names their
        wallet as owner, which is why the two never exist as separate endpoints.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Token account parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.CreateAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fund and initialize an SPL Token holder account
      tags:
      - transaction
  /svm/v2/transaction/token/create-ata:
    post:
      consumes:
      - application/json
      description: 'Derives the associated token address and creates it. The address
        is not a request field: it follows from wallet, mint, and program, so nothing
        generates a keypair for it and nothing has to remember it. The account itself
        does not sign, unlike a keypair token account, because a program derived address
        has no private key. Fails if the account already exists; use create-ata-idempotent
        when that is not known in advance.'
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Associated account parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.CreateATARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.CreateATAResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create the canonical token account for a wallet and mint
      tags:
      - transaction
  /svm/v2/transaction/token/create-ata-idempotent:
    post:
      consumes:
      - application/json
      description: 'Same as create-ata, except the instruction succeeds rather than
        fails when the account is already there. This is the one to prepend to a transfer:
        checking first and creating only if absent leaves a window in which somebody
        else creates it, and the plain create would then fail the whole transaction
        over an account that exists and is correct.'
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Associated account parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.CreateATAIdempotentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.CreateATAIdempotentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create the canonical token account, succeeding if it exists
      tags:
      - transaction
  /svm/v2/transaction/token/create-mint:
    post:
      consumes:
      - application/json
      description: System CreateAccount and InitializeMint2 as one transaction. An
        uninitialized Token-owned account can be initialized by anybody else before
        its intended owner does, so the two never exist as separate endpoints.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Mint parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.CreateMintRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.CreateMintResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fund and initialize an SPL Token mint
      tags:
      - transaction
  /svm/v2/transaction/token/freeze-account:
    post:
      consumes:
      - application/json
      description: 'Freezes a token account, so it rejects transfer, burn, and approve
        until thawed. The authority is the mint''s freeze authority, not the account''s
        owner or any delegate: freezing is a mint-level power to suspend any account
        holding it, on a different axis from who may spend a balance. Only works on
        a mint that was initialized with a freeze authority.'
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Freeze parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.FreezeAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.FreezeAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Suspend a token account
      tags:
      - transaction
  /svm/v2/transaction/token/mint-to-checked:
    post:
      consumes:
      - application/json
      description: Creates new supply and credits an existing token account. decimals
        is checked against the mint rather than filled in from it, which is what catches
        a client that formatted amount against the wrong decimals as a 400 instead
        of an on-chain failure.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Mint-to parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.MintToCheckedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.MintToCheckedResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Mint new supply into a token account
      tags:
      - transaction
  /svm/v2/transaction/token/revoke:
    post:
      consumes:
      - application/json
      description: 'Revokes an account''s delegate and delegated amount, whatever
        they are, without naming either: the program clears what is stored, so there
        is nothing to get wrong by naming it. An account with no delegate revokes
        cleanly too. Only the account''s owner may revoke, matching approve-checked''s
        rule that only the owner may grant one.'
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Revoke parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.RevokeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.RevokeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Clear whatever delegation an account currently has
      tags:
      - transaction
  /svm/v2/transaction/token/set-authority/close/clear:
    post:
      consumes:
      - application/json
      description: 'Clears close_authority to None. This is recoverable: the owner
        never goes away, and close-account already falls back to the owner when no
        close authority is set, so clearing this only reverts to that default.'
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Authority change parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SetCloseAuthorityClearRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SetCloseAuthorityClearResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove a token account's close authority
      tags:
      - transaction
  /svm/v2/transaction/token/set-authority/close/replace:
    post:
      consumes:
      - application/json
      description: 'Hands close_authority to new_authority. The current authority
        is whichever one is already recorded: the account''s close authority if one
        is set, otherwise its owner, the same rule close-account itself checks.'
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Authority change parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SetCloseAuthorityReplaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SetCloseAuthorityReplaceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Replace a token account's close authority
      tags:
      - transaction
  /svm/v2/transaction/token/set-authority/freeze/clear:
    post:
      consumes:
      - application/json
      description: Clears freeze_authority to None. No holder of this mint can ever
        be frozen afterward, and nothing can restore the capability.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Authority change parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SetFreezeAuthorityClearRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SetFreezeAuthorityClearResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove a mint's freeze authority permanently
      tags:
      - transaction
  /svm/v2/transaction/token/set-authority/freeze/replace:
    post:
      consumes:
      - application/json
      description: Hands freeze_authority to new_authority. The current authority
        must be the mint's existing freeze_authority exactly.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Authority change parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SetFreezeAuthorityReplaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SetFreezeAuthorityReplaceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Replace a mint's freeze authority
      tags:
      - transaction
  /svm/v2/transaction/token/set-authority/mint/clear:
    post:
      consumes:
      - application/json
      description: 'Clears mint_authority to None. This caps the supply forever: the
        program accepts a None mint_authority, and once it is None nothing can ever
        sign as that authority again to restore it.'
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Authority change parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SetMintAuthorityClearRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SetMintAuthorityClearResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove a mint's mint authority permanently
      tags:
      - transaction
  /svm/v2/transaction/token/set-authority/mint/replace:
    post:
      consumes:
      - application/json
      description: Hands mint_authority to new_authority. The current authority must
        be the mint's existing mint_authority exactly; there is no delegate concept
        for this role.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Authority change parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SetMintAuthorityReplaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SetMintAuthorityReplaceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Replace a mint's mint authority
      tags:
      - transaction
  /svm/v2/transaction/token/set-authority/owner/replace:
    post:
      consumes:
      - application/json
      description: 'Hands the account to new_authority. The current authority must
        be the account''s existing owner exactly, never a delegate. There is no clear
        variant: the owner field has no None representation on chain, and the program
        rejects one.'
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Authority change parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.SetAccountOwnerReplaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.SetAccountOwnerReplaceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Replace a token account's owner
      tags:
      - transaction
  /svm/v2/transaction/token/thaw-account:
    post:
      consumes:
      - application/json
      description: Reverses FreezeAccount, letting transfer, burn, and approve resume
        against the account. The authority is the mint's freeze authority, the same
        rule FreezeAccount applies.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Thaw parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.ThawAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.ThawAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resume a suspended token account
      tags:
      - transaction
  /svm/v2/transaction/token/transfer-checked:
    post:
      consumes:
      - application/json
      description: Transfers between token accounts, never to a wallet address directly.
        decimals is checked against the mint rather than filled in from it, catching
        a client that formatted amount against the wrong decimals as a 400 instead
        of an on-chain failure. authority must be the source account's owner, or its
        delegate for no more than the delegated amount.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Transfer parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.TransferCheckedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.TransferCheckedResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Move a balance between two token accounts of the same mint
      tags:
      - transaction
  /svm/v2/transaction/token/transfer-to-wallet:
    post:
      consumes:
      - application/json
      description: 'Derives both sides'' associated token accounts from account and
        destination and transfers between them, prepending an idempotent create for
        the destination when it does not exist yet. Both fields are wallet addresses,
        not token accounts, which is the whole reason this endpoint exists rather
        than being transfer-checked with a flag: neither side computes an associated
        address first. The source''s associated account is never created, since an
        account nobody has funded has nothing to send. decimals is checked against
        the mint rather than filled in from it, catching a client that formatted amount
        against the wrong decimals as a 400 instead of an on-chain failure. authority
        must be account''s associated account owner, or its delegate for no more than
        the delegated amount.'
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Transfer parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_v2.TransferToWalletRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_v2.TransferToWalletResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Move a balance between the associated token accounts of two wallets
      tags:
      - transaction
swagger: "2.0"
