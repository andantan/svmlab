  /svm/v2/transaction/token/close-account:
    post:
      consumes:
      - application/json
      description: token_account must already hold no tokens; the balance is not swept,
        it has to be zero. A wrapped SOL account is the exception, since its lamports
        are its balance, and closing it is how SOL is unwrapped. token_account_close_authority
