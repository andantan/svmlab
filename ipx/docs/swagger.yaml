  /svm/tool/generate/keypair:
    post:
      description: 'Returns a new key pair in the base58 form config.yaml expects,
        so it can be added as a keys entry and used as a signer. Nothing is written
        or funded: the address does not exist on any cluster until a transaction creates
        it, which is what makes a fresh pair usable as the new_account of a create-account
        build.'
      parameters:
