  /svm/v2/transaction/token/transfer-from-ata/max:
    post:
      consumes:
      - application/json
      description: 'Same as transfer-from-ata, except the amount moved is the derived
        source''s current balance rather than a caller-given one. decimals is never
        a request field, since there is no client-computed amount to protect against
        a wrong decimals assumption; the mint''s own value is used to build the instruction
        directly. Unlike a lamport sweep, the source carries no rent-exemption floor:
        a token account can hold zero tokens and still exist, so it is always swept
        all the way to zero, even when it is also fee_payer. recent_blockhash is always
        required and is never fetched server-side. Left alone, it also builds the
        message and expires whenever the runtime says it does. Naming durable_nonce_account
        builds the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well.'
