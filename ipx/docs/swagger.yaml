basePath: /
definitions:
  account.AccountAuthorityRequest:
    properties:
      public_key:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
    type: object
  account.AccountAuthorityResponse:
    properties:
      close_authority:
        description: |-
          CloseAuthority reports who can actually close this token account,
          which is never blank once Type is token_account: the program checks
          close_authority.unwrap_or(owner), so this is TokenOwner whenever the
          account carries no close authority of its own, and the stored value
          otherwise. It is never left for the caller to resolve that fallback.
        type: string
      delegate:
        type: string
      exists:
        type: boolean
      freeze_authority:
        type: string
      m:
        description: M, N, and Signers are set only when Type is multisig.
        type: integer
      mint_authority:
        description: |-
          MintAuthority and FreezeAuthority are relevant only when Type is mint.
          Either can be permanently removed on a real mint, and empty here means
          exactly that: gone for good, not merely unset.
        type: string
      "n":
        type: integer
      nonce_authority:
        description: |-
          NonceAuthority is relevant only when Type is nonce_account, and even
          then only once initialized — it is always present in the response
          (empty when it does not apply) rather than silently omitted, so an
          empty string is never ambiguous between "not this kind of account" and
          "this account has none".
        type: string
      owner:
        type: string
      public_key:
        type: string
      signers:
        items:
          type: string
        type: array
      token_owner:
        description: |-
          TokenOwner and Delegate are relevant only when Type is token_account.
          Delegate empty means no delegate is currently approved.
        type: string
      type:
        type: string
    type: object
  account.AccountOwnerRequest:
    properties:
      public_key:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
    type: object
  account.AccountOwnerResponse:
    properties:
      exists:
        type: boolean
      owner:
        type: string
      public_key:
        type: string
      system_owned:
        type: boolean
    type: object
  account.AccountRequest:
    properties:
      public_key:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
    type: object
  account.AccountResponse:
    properties:
      data:
        type: string
      executable:
        type: boolean
      exists:
        type: boolean
      initialized:
        description: |-
          Initialized is true for anything without an uninitialized state of its
          own to report — a plain wallet, a program, an account this endpoint has
          no parser for. It is only ever false for the handful of layouts that
          actually carry an initialization flag: a durable nonce account, a mint,
          a token account, or a multisig, allocated and assigned to the right
          program but not yet initialized by InitializeMint*/InitializeAccount*/
          InitializeMultisig*.
        type: boolean
      lamports:
        type: string
      owner:
        type: string
      public_key:
        type: string
      sol:
        type: string
      space:
        type: integer
    type: object
  account.AirdropRequest:
    properties:
      public_key:
        type: string
    type: object
  account.AirdropResponse:
    properties:
      lamports:
        type: string
      signature:
        type: string
      sol:
        type: string
    type: object
  account.BalanceResponse:
    properties:
      lamports:
        type: string
      public_key:
        type: string
      sol:
        type: string
    type: object
  account.NonceRequest:
    properties:
      public_key:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
    type: object
  account.NonceResponse:
