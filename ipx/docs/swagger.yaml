      decimals:
        type: integer
      destination:
        type: string
      fee:
        type: string
      message:
        type: string
      mint:
        type: string
      nonce_authority:
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      source:
        type: string
      transaction:
        type: string
    type: object
  api_handler_v2.TransferToWalletRequest:
    properties:
      account:
        description: |-
          Account is the sender's wallet. Its associated token account is
          derived rather than accepted directly, and unlike Destination it is
          never created: an account nobody has funded has nothing to send, so a
          missing source fails rather than being created empty.
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      amount:
        example: "250000"
        type: string
      authority:
        description: |-
          Authority signs for the source account. It is usually Account itself,
          but kept as its own field because it need not be: a delegate approved
          for no more than its delegated amount may sign in Account's place, the
          same rule transfer-checked applies to any source.
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      decimals:
        example: 6
        type: integer
      destination:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      mint:
        example: ""
        type: string
      multisig_signers:
        description: |-
          MultisigSigners is empty for a single-signer authority. Non-empty, the
          authority itself does not sign; the named members do, in its place.
        items:
          type: string
        type: array
      nonce_account:
        example: ""
        type: string
      program:
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
      rent_payer:
        description: |-
          RentPayer covers the rent-exemption deposit if destination's
          associated account does not exist yet, distinct from FeePayer in the
          same way create-ata's is: a caller funding somebody else's account
          need not also be covering the transaction fee.
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
    type: object
  api_handler_v2.TransferToWalletResponse:
    properties:
      account:
        type: string
      account_keys:
        items:
          type: string
        type: array
      amount:
        type: string
      authority:
        type: string
      created_ata:
        description: |-
          CreatedATA records whether an idempotent create was prepended for the
          destination, since the same request against an already-funded
          destination does not need one. The source associated account is never
          created by this endpoint, so there is nothing equivalent to record for
          it.
        type: boolean
      decimals:
        type: integer
      destination:
        type: string
      destination_associated_account:
        type: string
      fee:
        type: string
      message:
        type: string
      mint:
        type: string
      nonce_authority:
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      rent_exempt:
        type: string
      signers:
        items:
          type: string
        type: array
      source_associated_account:
        type: string
      transaction:
        type: string
    type: object
host: localhost:33153
info:
  contact: {}
  description: Solana transaction API
  title: SVMlab API
  version: "1.0"
paths:
  /svm/account/airdrop:
    post:
      consumes:
      - application/json
      description: Requests a fixed half a SOL. The amount is not a field because
        the faucet enforces its own limit, and asking above it fails the call rather
        than handing out less.
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_account.AirdropRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_account.AirdropResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fund an account on devnet or testnet
      tags:
      - account
  /svm/account/authority:
    post:
      consumes:
      - application/json
      description: 'Reports the authority for whichever kind of account public_key
        names: a durable nonce account''s authority, a mint''s mint_authority and
        freeze_authority, a token account''s token_owner, delegate, and close_authority,
        or a multisig''s m, n, and signers. type says which of these applies, and
        is system_account for a plain account with none of them, or unknown for a
        program-owned account this endpoint has no parser for.'
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_account.AccountAuthorityRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_account.AccountAuthorityResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read the authority-bearing fields of an account
      tags:
      - account
  /svm/account/balance:
    post:
      consumes:
      - application/json
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_account.AccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_account.BalanceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read an account's balance
      tags:
      - account
  /svm/account/nonce:
    post:
      consumes:
      - application/json
      description: 'Parses the 80 bytes a nonce account holds. The stored nonce is
        what a transaction may carry in place of a recent blockhash so that it never
        expires, which is the opposite of an EVM nonce: there a per-account counter
        prevents replay, here expiry is what is being removed. An account sized by
        create-account but never initialized is a normal intermediate state and reports
        initialized=false with all-zero fields.'
      parameters:
      - description: Nonce account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_account.NonceRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_account.NonceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read a durable nonce account
      tags:
      - account
  /svm/account/owner:
    post:
      consumes:
      - application/json
      description: Only the owning program may debit an account or write its data.
        An account owned by anything other than the System Program cannot be moved
        with a system transfer, and one owned by a non-executable address cannot be
        moved at all, so system_owned answers whether the balance is still reachable.
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_account.AccountOwnerRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_account.AccountOwnerResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read who owns an account
      tags:
      - account
  /svm/account/state:
    post:
      consumes:
      - application/json
      description: Returns the owner, executable flag, data size, balance, and data.
        An account that does not exist is reported with exists=false rather than as
        an error, since most 32-byte values name one nobody has created.
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_account.AccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_account.AccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read an account's on-chain state
      tags:
      - account
  /svm/account/tokens:
    post:
      consumes:
      - application/json
      description: Lists token accounts owned by a wallet under both the classic Token
        Program and Token-2022. The response keeps the program on each account because
        the two programs own separate accounts and no single token instruction can
        touch both at once.
      parameters:
      - description: Wallet
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_account.TokensRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_account.TokensResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List the token accounts a wallet owns
      tags:
      - account
  /svm/cluster/blockhash:
    post:
      description: Returns the blockhash to build against and the block height past
        which it is rejected, so expiry can be checked rather than guessed. Fetched
        at finalized commitment, since a blockhash from a less settled view risks
        belonging to a fork.
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_misc.BlockhashResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read a recent blockhash
      tags:
      - cluster
  /svm/cluster/genesis-hash:
    post:
      description: A genesis hash is not folded into a signature the way EIP-155 binds
        a chain id, so nothing on chain prevents a transaction from replaying on another
        cluster. Comparing what the endpoint reports against what config names is
        the substitute check.
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_misc.GenesisHashResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read the cluster's genesis hash and compare it to config
      tags:
      - cluster
  /svm/cluster/health:
    post:
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_misc.HealthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read the node's health
      tags:
      - cluster
  /svm/cluster/slot:
    post:
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_misc.SlotResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read the current slot
      tags:
      - cluster
  /svm/cluster/transaction/fee:
    post:
      consumes:
      - application/json
      description: The fee follows from the signature count and any compute budget
        instructions, both of which live in the message, so it is known before signing
        and cannot be exceeded by execution the way a gas estimate can.
      parameters:
      - description: Message
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_misc.FeeRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_misc.FeeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Price a message
      tags:
      - cluster
  /svm/cluster/transaction/refresh-blockhash:
    post:
      consumes:
      - application/json
      description: Swaps in a fresh blockhash at finalized commitment, so a transaction
        built too long ago can still be signed and sent instead of failing "blockhash
        not found". transaction is base64. The transaction must be unsigned — refreshing
        after signing would leave every signature invalid without anything here able
        to tell, so it is refused rather than silently returned broken.
      parameters:
      - description: Transaction
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_misc.RefreshBlockhashRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_misc.RefreshBlockhashResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Replace an unsigned transaction's recent blockhash
      tags:
      - cluster
  /svm/cluster/transaction/replace-blockhash-with-nonce:
    post:
      consumes:
      - application/json
      description: 'Recompiles a transaction so it draws its message blockhash from
        a durable nonce account and advances that nonce as its first instruction,
        which is what makes it stop expiring. transaction is base64 and must be unsigned:
        this rebuilds the account list rather than editing it, so any existing signature
        covers a message that no longer exists. The nonce authority is read off the
        account rather than taken from the request, and it becomes a required signer,
        so read signers in the response rather than assuming it matches what went
        in. A legacy transaction and a versioned (v0) one that declares no address
        lookup tables are both accepted; the result is legacy either way. A v0 transaction
        that does use lookup tables is refused, since the accounts its instructions
        point at are not in the message.'
      parameters:
      - description: Transaction and nonce account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_misc.ReplaceBlockhashWithNonceRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_misc.ReplaceBlockhashWithNonceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Rebuild an unsigned transaction against a durable nonce
      tags:
      - cluster
  /svm/cluster/transaction/send:
    post:
      consumes:
      - application/json
      description: Submits a fully signed transaction to the cluster and returns its
        signature. transaction is base64. Never parses the message inside, only checks
        that every signature slot is filled, so a versioned (v0) transaction is accepted
        the same as a legacy one. Acceptance is not execution; the transaction still
        has to land in a block.
      parameters:
      - description: Signed transaction
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_misc.SendTransactionRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_misc.SendTransactionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Broadcast a signed transaction
      tags:
      - cluster
  /svm/cluster/transaction/simulate:
    post:
      consumes:
      - application/json
      description: Runs a fully signed transaction against the node's state without
        broadcasting it, and returns the program logs either way. transaction is base64.
        Never parses the message inside, only checks that every signature slot is
        filled, so a versioned (v0) transaction is accepted the same as a legacy one.
        The logs are the only account of why execution stopped; nothing here corresponds
        to a revert string.
      parameters:
      - description: Transaction
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_misc.SimulateTransactionRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_misc.SimulateTransactionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Execute a transaction without submitting it
      tags:
      - cluster
  /svm/cluster/transaction/status:
    post:
      consumes:
      - application/json
      description: 'Stands in for an EVM receipt, but found can stay false forever:
        a transaction whose blockhash expired is forgotten and never lands.'
      parameters:
      - description: Signature
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_misc.SignatureStatusRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_misc.SignatureStatusResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read a transaction's status
      tags:
      - cluster
  /svm/cluster/version:
    post:
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_misc.VersionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read the node's software version
      tags:
      - cluster
  /svm/protocol/rent-exemption/mint:
    post:
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_misc.RentExemptionMintResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Minimum balance for an SPL Token mint
      tags:
      - protocol
  /svm/protocol/rent-exemption/nonce:
    post:
      description: A nonce account has to stay rent exempt to keep holding its nonce,
        so this is what one must be funded with. It is also the floor a partial withdrawal
        has to leave behind.
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_misc.RentExemptionNonceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Minimum balance for a durable nonce account
      tags:
      - protocol
  /svm/protocol/rent-exemption/public-key:
    post:
      consumes:
      - application/json
      description: Reads the size from a live account, so the caller does not have
        to know the layout. Pass a byte count to the space endpoint instead when the
        account does not exist yet.
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_handler_misc.RentExemptionPublicKeyRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_handler_misc.RentExemptionPublicKeyResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Minimum balance for an account of the same size as an existing one
      tags:
      - protocol
  /svm/protocol/rent-exemption/space:
    post:
      consumes:
      - application/json
