basePath: /
definitions:
  api_handler_account.AccountAuthorityRequest:
    properties:
      public_key:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
    type: object
  api_handler_account.AccountAuthorityResponse:
    properties:
      close_authority:
        type: string
      delegate:
        type: string
      exists:
        type: boolean
      freeze_authority:
        type: string
      m:
        description: M, N, and Signers are set only when Type is multisig.
        type: integer
      mint_authority:
        description: |-
          MintAuthority and FreezeAuthority are set only when Type is mint.
          Either may still be empty: both are optional on a mint, and removing
          one is one-way.
        type: string
      "n":
        type: integer
      nonce_authority:
        description: |-
          NonceAuthority is set only when Type is nonce_account and it is
          initialized; an account sized for a nonce but never initialized reports
          the type with this left empty.
        type: string
      owner:
        type: string
      public_key:
        type: string
      signers:
        items:
          type: string
        type: array
      token_owner:
        description: |-
          TokenOwner, Delegate, and CloseAuthority are set only when Type is
          token_account. Delegate and CloseAuthority are both optional; close
          authority only exists at all under Token-2022.
        type: string
      type:
        type: string
    type: object
  api_handler_account.AccountOwnerRequest:
    properties:
      public_key:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
    type: object
  api_handler_account.AccountOwnerResponse:
    properties:
      exists:
        type: boolean
      owner:
        type: string
      public_key:
        type: string
      system_owned:
        type: boolean
    type: object
  api_handler_account.AccountRequest:
    properties:
      public_key:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
    type: object
  api_handler_account.AccountResponse:
    properties:
      data:
        type: string
      executable:
        type: boolean
      exists:
        type: boolean
      lamports:
        type: string
      owner:
        type: string
      public_key:
        type: string
      sol:
        type: string
      space:
        type: integer
    type: object
  api_handler_account.AirdropRequest:
