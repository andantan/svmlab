server_addr: ":33153"

# Solana has no chain id. A cluster is identified by its genesis hash,
# which can be verified at runtime via the getGenesisHash RPC method.
chain:
  - name: "solana"
    network: "mainnet"
    genesis_hash: "5eykt4UsFv8P8NJdTREpY1vzqKqZKvdpKuc147dw2N9d"
    native_currency:
      symbol: "SOL"
      decimals: 9
    rpc: "RPC_URL"

  - name: "solana"
    network: "testnet"
    genesis_hash: "EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG"
    native_currency:
      symbol: "SOL"
      decimals: 9
    rpc: "https://api.devnet.solana.com"

# WARNING: LOCAL DEVELOPMENT ONLY
# Unlike an EVM genesis block, solana-test-validator has no deterministic
# pre-funded accounts. These keypairs are generated locally and funded via
# the requestAirdrop RPC method.
#
# public_key  — base58, 32 bytes. This IS the account address.
# private_key — base58, 64 bytes ([seed 32 || public_key 32]).
keys:
  - alias: key0
    public_key: "NEED_KEYGEN"
    private_key: "NEED_KEYGEN"
