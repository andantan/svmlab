  /svm/v2/transaction/token/initialize-immutable-owner:
    post:
      consumes:
      - application/json
      description: 'Locks token_account''s owner field against SetAuthority forever.
        This is a Token-2022 extension: it needs extension space appended after the
        classic 165-byte layout, which classic Token accounts never have. On Token-2022
        this attaches the real extension; on classic Token, upstream documents this
        opcode as a no-op, kept only so the Associated Token Account program can call
        it on either program without branching, so program accepts either. token_account
        must already exist, be owned by program, be at least 165 bytes, and — critically
        — still be Uninitialized at the base layout: the program itself requires extensions
        to attach before initialize-account*/initialize-mint* commits the account,
        not after, so this has to run first or it fails on chain. Whether the extension
        space itself is actually reserved is not verified here (Token-2022 extension
        TLV parsing is its own separate undertaking), so that specific mismatch still
        fails on chain rather than as a 400. There is no authority: nothing about
        locking the owner field needs proving. The Associated Token Account program
        calls this automatically on every account it creates, regardless of program,
        before its own initialize-account3 equivalent. recent_blockhash is always
        required and is never fetched server-side. Left alone, it also builds the
        message and expires whenever the runtime says it does. Naming durable_nonce_account
        builds the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well.'
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Initialize-immutable-owner parameters
        in: body
        name: body
        required: true
