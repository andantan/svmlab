      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
  v2.SystemTransferRequest:
    properties:
      amount:
        example: "1000000"
        type: string
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      from:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      to:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
    type: object
  v2.SystemTransferResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      amount:
        description: |-
          Amount and Fee are strings for the same reason the request's amount is:
          a JSON number is a float, so a lamport count past 2^53 would reach a
          JavaScript client already rounded.
        type: string
      amount_sol:
        type: string
      fee:
        type: string
      message:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
host: localhost:33153
info:
  contact: {}
  description: Solana transaction API
  title: SVMlab API
  version: "1.0"
paths:
  /svm/rpc/:
    post:
      consumes:
      - application/json
      description: Passes a method straight through, so anything this API has not
        wrapped stays reachable.
      parameters:
      - description: Method and params
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.RawRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Call any JSON-RPC method
      tags:
      - rpc
  /svm/rpc/account:
    post:
      consumes:
      - application/json
      description: Returns the owner, executable flag, data size, and data. An account
        that does not exist is reported with exists=false rather than as an error,
        since most 32-byte values name one nobody has created.
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.AccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.AccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read an account's on-chain state
      tags:
      - rpc
  /svm/rpc/account/owner:
    post:
      consumes:
      - application/json
      description: Only the owning program may debit an account or write its data.
        An account owned by anything other than the System Program cannot be moved
        with a system transfer, and one owned by a non-executable address cannot be
        moved at all, so system_owned answers whether the balance is still reachable.
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.AccountOwnerRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.AccountOwnerResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read who owns an account
      tags:
      - rpc
  /svm/rpc/airdrop:
    post:
      consumes:
      - application/json
      description: Requests a fixed half a SOL. The amount is not a field because
        the faucet enforces its own limit, and asking above it fails the call rather
        than handing out less.
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.AirdropRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.AirdropResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fund an account on devnet or testnet
      tags:
      - rpc
  /svm/rpc/balance:
    post:
      consumes:
      - application/json
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.AccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.BalanceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read an account's balance
      tags:
      - rpc
  /svm/rpc/batch:
    post:
      consumes:
