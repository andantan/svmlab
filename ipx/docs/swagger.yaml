basePath: /
definitions:
  misc.AccountOwnerRequest:
    properties:
      public_key:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
    type: object
  misc.AccountOwnerResponse:
    properties:
      exists:
        type: boolean
      owner:
        type: string
      public_key:
        type: string
      system_owned:
        type: boolean
    type: object
  misc.AccountRequest:
    properties:
      public_key:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
    type: object
  misc.AccountResponse:
    properties:
      data:
        type: string
      executable:
        type: boolean
      exists:
        type: boolean
      lamports:
        type: string
      owner:
        type: string
      public_key:
        type: string
      sol:
        type: string
      space:
        type: integer
    type: object
  misc.AirdropRequest:
    properties:
      amount:
        example: "1000000000"
        type: string
      public_key:
        type: string
    type: object
  misc.AirdropResponse:
    properties:
      signature:
        type: string
    type: object
  misc.BalanceResponse:
    properties:
      lamports:
        type: string
      public_key:
        type: string
      sol:
        type: string
    type: object
  misc.BatchCall:
    properties:
      method:
        type: string
      params: {}
    type: object
  misc.BatchRequest:
    properties:
      calls:
        items:
          $ref: '#/definitions/misc.BatchCall'
        type: array
    type: object
  misc.BlockhashResponse:
    properties:
      blockhash:
        type: string
      last_valid_block_height:
        type: integer
    type: object
  misc.FeeRequest:
    properties:
      message:
        type: string
    type: object
  misc.FeeResponse:
    properties:
      lamports:
        type: string
      sol:
        type: string
      valid:
        type: boolean
    type: object
  misc.GenerateKeypairResponse:
    properties:
      private_key:
        type: string
      public_key:
        type: string
    type: object
  misc.GenesisHashResponse:
    properties:
      configured:
        type: string
      genesis_hash:
        type: string
      matches:
        type: boolean
    type: object
  misc.HealthResponse:
    properties:
      health:
        type: string
    type: object
  misc.RawRequest:
    properties:
      method:
        example: getEpochInfo
        type: string
      params: {}
    type: object
  misc.RentExemptionMintResponse:
    properties:
      lamports:
        type: string
      sol:
        type: string
      space:
        type: integer
    type: object
  misc.RentExemptionPublicKeyResponse:
    properties:
      lamports:
        type: string
      public_key:
        type: string
      sol:
        type: string
      space:
        type: integer
    type: object
  misc.RentExemptionSpaceRequest:
    properties:
      space:
        example: "165"
        type: string
    type: object
  misc.RentExemptionSpaceResponse:
    properties:
      lamports:
        type: string
      sol:
        type: string
      space:
        type: integer
    type: object
  misc.RentExemptionStakeResponse:
    properties:
      lamports:
        type: string
      sol:
        type: string
      space:
        type: integer
    type: object
  misc.RentExemptionSystemResponse:
    properties:
      lamports:
        type: string
      sol:
        type: string
      space:
        type: integer
    type: object
  misc.RentExemptionTokenResponse:
    properties:
      lamports:
        type: string
      sol:
        type: string
      space:
        type: integer
    type: object
  misc.RentExemptionVoteResponse:
    properties:
      lamports:
        type: string
      sol:
        type: string
      space:
        type: integer
    type: object
  misc.SendTransactionRequest:
    properties:
      transaction:
        type: string
    type: object
  misc.SendTransactionResponse:
    properties:
      signature:
        type: string
    type: object
  misc.SignRequest:
    properties:
      message:
        type: string
      public_key:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
    type: object
  misc.SignResponse:
    properties:
      public_key:
        type: string
      signature:
        type: string
    type: object
  misc.SignTransactionRequest:
    properties:
      private_keys:
        items:
          type: string
        type: array
      public_keys:
        example:
        - EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
  misc.SignTransactionResponse:
    properties:
      fully_signed:
        type: boolean
      signatures:
        items:
          type: string
        type: array
      transaction:
        type: string
      transaction_id:
        type: string
    type: object
  misc.SignatureStatusRequest:
    properties:
      signature:
        type: string
    type: object
  misc.SignatureStatusResponse:
    properties:
      confirmation_status:
        type: string
      confirmations:
        type: integer
      err:
        type: string
      failed:
        type: boolean
      found:
        type: boolean
      signature:
        type: string
      slot:
        type: integer
    type: object
  misc.SimulateTransactionRequest:
    properties:
      transaction:
        type: string
    type: object
  misc.SimulateTransactionResponse:
    properties:
      err:
        type: string
      failed:
        type: boolean
      logs:
        items:
          type: string
        type: array
      units_consumed:
        type: integer
    type: object
  misc.SlotResponse:
    properties:
      slot:
        type: integer
    type: object
  misc.VerifyRequest:
    properties:
      message:
        type: string
      public_key:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      signature:
        type: string
    type: object
  misc.VerifyResponse:
    properties:
      valid:
        type: boolean
    type: object
  misc.VersionResponse:
    properties:
      version:
        additionalProperties: {}
        type: object
    type: object
  v1.Account:
    properties:
      is_signer:
        example: true
        type: boolean
      is_writable:
        example: true
        type: boolean
      public_key:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
    type: object
  v1.BuildTransactionRequest:
    properties:
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      instructions:
        items:
          $ref: '#/definitions/v1.Instruction'
        type: array
      recent_blockhash:
        description: |-
          RecentBlockhash may be left empty, in which case it is fetched from the
          cluster. Supplying it makes the call deterministic, which is what allows
          the same request to reproduce identical bytes.
        example: ""
        type: string
    type: object
  v1.BuildTransactionResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      header:
        $ref: '#/definitions/v1.Header'
      message:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      size:
        type: integer
      transaction:
        type: string
    type: object
  v1.Header:
    properties:
      num_readonly_signed_accounts:
        type: integer
      num_readonly_unsigned_accounts:
        type: integer
      num_required_signatures:
        type: integer
    type: object
  v1.Instruction:
    properties:
      accounts:
        items:
          $ref: '#/definitions/v1.Account'
        type: array
      data:
        example: AgAAAECcAAAAAAAA
        type: string
      program_id:
        example: "11111111111111111111111111111111"
        type: string
    type: object
  v2.SystemCreateAccountRequest:
    properties:
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      from:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      lamports:
        example: "890880"
        type: string
      new_account:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
      space:
        example: "0"
        type: string
    type: object
  v2.SystemCreateAccountResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      fee:
        type: string
      lamports:
        type: string
      lamports_sol:
        type: string
      message:
        type: string
      owner:
        type: string
      recent_blockhash:
        type: string
      rent_exempt:
        description: |-
          RentExempt is the floor the requested space had to clear. It is
          reported because the server had to resolve it to validate lamports
          anyway, and it is what a caller needs to know to fund the next one
          without guessing.
        type: string
      signers:
        items:
          type: string
        type: array
      space:
        type: integer
      transaction:
        type: string
    type: object
  v2.SystemTransferMaxRequest:
    properties:
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      from:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      to:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
    type: object
  v2.SystemTransferMaxResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      amount:
        type: string
      amount_sol:
        type: string
      fee:
        type: string
      message:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
  v2.SystemTransferRequest:
    properties:
      amount:
        example: "1000000"
        type: string
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      from:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      to:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
    type: object
  v2.SystemTransferResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      amount:
        description: |-
          Amount and Fee are strings for the same reason the request's amount is:
          a JSON number is a float, so a lamport count past 2^53 would reach a
          JavaScript client already rounded.
        type: string
      amount_sol:
        type: string
      fee:
        type: string
      message:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
host: localhost:33153
info:
  contact: {}
  description: Solana transaction API
  title: SVMlab API
  version: "1.0"
paths:
  /svm/rpc/:
    post:
      consumes:
      - application/json
      description: Passes a method straight through, so anything this API has not
        wrapped stays reachable.
      parameters:
      - description: Method and params
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.RawRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Call any JSON-RPC method
      tags:
      - rpc
  /svm/rpc/account:
    post:
      consumes:
      - application/json
      description: Returns the owner, executable flag, data size, and data. An account
        that does not exist is reported with exists=false rather than as an error,
        since most 32-byte values name one nobody has created.
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.AccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.AccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read an account's on-chain state
      tags:
      - rpc
  /svm/rpc/account/owner:
    post:
      consumes:
      - application/json
      description: Only the owning program may debit an account or write its data.
        An account owned by anything other than the System Program cannot be moved
        with a system transfer, and one owned by a non-executable address cannot be
        moved at all, so system_owned answers whether the balance is still reachable.
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.AccountOwnerRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.AccountOwnerResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read who owns an account
      tags:
      - rpc
  /svm/rpc/airdrop:
    post:
      consumes:
      - application/json
      parameters:
      - description: Account and amount
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.AirdropRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.AirdropResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fund an account on devnet or testnet
      tags:
      - rpc
  /svm/rpc/balance:
    post:
      consumes:
      - application/json
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.AccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.BalanceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read an account's balance
      tags:
      - rpc
  /svm/rpc/batch:
    post:
      consumes:
      - application/json
      parameters:
      - description: Calls
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.BatchRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Call several JSON-RPC methods in one round trip
      tags:
      - rpc
  /svm/rpc/blockhash:
    post:
      description: Returns the blockhash to build against and the block height past
        which it is rejected, so expiry can be checked rather than guessed. Fetched
        at finalized commitment, since a blockhash from a less settled view risks
        belonging to a fork.
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.BlockhashResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read a recent blockhash
      tags:
      - rpc
  /svm/rpc/fee:
    post:
      consumes:
      - application/json
      description: The fee follows from the signature count and any compute budget
        instructions, both of which live in the message, so it is known before signing
        and cannot be exceeded by execution the way a gas estimate can.
      parameters:
      - description: Message
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.FeeRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.FeeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Price a message
      tags:
      - rpc
  /svm/rpc/genesis-hash:
    post:
      description: A genesis hash is not folded into a signature the way EIP-155 binds
        a chain id, so nothing on chain prevents a transaction from replaying on another
        cluster. Comparing what the endpoint reports against what config names is
        the substitute check.
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.GenesisHashResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read the cluster's genesis hash and compare it to config
      tags:
      - rpc
  /svm/rpc/health:
    post:
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.HealthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read the node's health
      tags:
      - rpc
  /svm/rpc/rent-exemption/mint:
    post:
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.RentExemptionMintResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Minimum balance for an SPL Token mint
      tags:
      - rpc
  /svm/rpc/rent-exemption/public-key:
    post:
      consumes:
      - application/json
      description: Reads the size from a live account, so the caller does not have
        to know the layout. Pass a byte count to the space endpoint instead when the
        account does not exist yet.
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.AccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.RentExemptionPublicKeyResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Minimum balance for an account of the same size as an existing one
      tags:
      - rpc
  /svm/rpc/rent-exemption/space:
    post:
      consumes:
      - application/json
      description: Takes a byte count rather than an account kind, which covers layouts
        none of the named endpoints describe and sizes no live account holds yet.
      parameters:
      - description: Space
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.RentExemptionSpaceRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.RentExemptionSpaceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Minimum balance for a size given directly
      tags:
      - rpc
  /svm/rpc/rent-exemption/stake:
    post:
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.RentExemptionStakeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Minimum balance for a stake account
      tags:
      - rpc
  /svm/rpc/rent-exemption/system:
    post:
      description: A wallet holds lamports and no data, so this is the floor any account
        must clear. It is also what a transfer to a previously unused address has
        to meet, since the transfer creates the account.
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.RentExemptionSystemResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Minimum balance for a plain wallet
      tags:
      - rpc
  /svm/rpc/rent-exemption/token:
    post:
      description: Every token balance lives in an account of its own, so opening
        a position in a new token costs this much before any tokens move.
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
