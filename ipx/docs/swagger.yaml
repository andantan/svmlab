            type: object
      summary: Grant a delegate effectively unlimited spending rights over a token
        account
      tags:
      - v2-transaction-token-delegation
  /svm/v2/transaction/token/approve/max:
    post:
      consumes:
      - application/json
      description: 'Same as approve, except no amount is read at all: it grants the
        maximum representable base-unit amount directly, mirroring approve-checked/max
        and the standard effectively-unlimited approval pattern. Neither the mint
        nor decimals is named or verified against the account, the same as approve;
