        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      nonce_account:
        description: |-
          NonceAccount may be left empty, in which case a recent blockhash is
          fetched and the transaction expires with it. Naming one builds against
          the value that account stores instead, so the transaction never expires.
        example: ""
        type: string
      owner:
        example: "11111111111111111111111111111111"
        type: string
      seed:
        example: vault-1
        type: string
      to:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
    type: object
  v2.SystemSeedTransferResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      amount:
        type: string
      amount_sol:
        type: string
      derived_address:
        type: string
      fee:
        type: string
      message:
        type: string
      nonce_authority:
        description: |-
          NonceAuthority is present only when the transaction was built against a
          durable nonce, so it doubles as the signal that RecentBlockhash carries a
          stored value rather than a fetched blockhash.
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
  v2.SystemTransferBatchRequest:
    properties:
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      nonce_account:
        description: |-
          NonceAccount may be left empty, in which case a recent blockhash is
          fetched and the transaction expires with it. Naming one builds against
          the value that account stores instead, so the transaction never expires.
          Collecting a signature from every sender takes longer than a blockhash
          lasts, so this is the endpoint a durable nonce exists for.
        example: ""
        type: string
      transfers:
        items:
          $ref: '#/definitions/v2.SystemTransferBatchTransfer'
        type: array
    type: object
  v2.SystemTransferBatchResponse:
    properties:
      account_keys:
        description: |-
          AccountKeys is shorter than the transfers imply, since a sender paying
          two addresses and the System Program in every instruction are each one
          key here. Signers holds every distinct sender, and the fee payer beside
          them when it is not one of them.
        items:
          type: string
        type: array
      fee:
        type: string
      message:
        type: string
      nonce_authority:
        description: |-
          NonceAuthority is present only when the transaction was built against a
          durable nonce, so it doubles as the signal that RecentBlockhash carries a
          stored value rather than a fetched blockhash.
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      size:
        description: |-
          Size and SizeLimit bind harder here than anywhere else. Each sender
          costs a 64 byte signature beside its 32 byte account key, so a batch
          runs out of room after far fewer transfers than transfer/many does.
        type: integer
      size_limit:
        type: integer
      total:
        type: string
      total_sol:
        type: string
      transaction:
        type: string
      transfers:
        items:
          $ref: '#/definitions/v2.SystemTransferBatchTransferResponse'
        type: array
    type: object
  v2.SystemTransferBatchTransfer:
    properties:
      amount:
        example: "100000000"
        type: string
      from:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      max:
        type: boolean
      to:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
    type: object
  v2.SystemTransferBatchTransferResponse:
    properties:
      amount:
        type: string
      amount_sol:
        type: string
      from:
        type: string
      max:
        type: boolean
      to:
        type: string
    type: object
  v2.SystemTransferManyRequest:
    properties:
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      from:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      nonce_account:
        description: |-
          NonceAccount may be left empty, in which case a recent blockhash is
          fetched and the transaction expires with it. Naming one builds against
          the value that account stores instead, so the transaction never expires.
        example: ""
        type: string
      transfers:
        items:
          $ref: '#/definitions/v2.SystemTransferManyTarget'
        type: array
    type: object
  v2.SystemTransferManyResponse:
    properties:
      account_keys:
        description: |-
          AccountKeys is shorter than the transfer list plus two. The sender
          appears in every instruction and the System Program in all of them, yet
          each is one key here: compiling a message deduplicates account keys and
          the instructions address them by index. This is the first endpoint whose
          response shows that.
        items:
          type: string
        type: array
      fee:
        type: string
      message:
        type: string
      nonce_authority:
        description: |-
          NonceAuthority is present only when the transaction was built against a
          durable nonce, so it doubles as the signal that RecentBlockhash carries a
          stored value rather than a fetched blockhash.
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      size:
        description: |-
          Size and SizeLimit are what bounds this endpoint. A transaction travels
          in one packet and cannot be split, so the recipient count is really a
          byte count, and reporting both lets a caller work out how many more
          would fit rather than discovering it by being refused.
        type: integer
      size_limit:
        type: integer
      total:
        type: string
      total_sol:
        type: string
      transaction:
        type: string
      transfers:
        items:
          $ref: '#/definitions/v2.SystemTransferManyTargetResponse'
        type: array
    type: object
  v2.SystemTransferManyTarget:
    properties:
      amount:
        example: "100000000"
        type: string
      to:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
    type: object
  v2.SystemTransferManyTargetResponse:
    properties:
      amount:
        type: string
      amount_sol:
        type: string
      to:
        type: string
    type: object
  v2.SystemTransferMaxRequest:
    properties:
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      from:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      nonce_account:
        description: |-
          NonceAccount may be left empty, in which case a recent blockhash is
          fetched and the transaction expires with it. Naming one builds against
          the value that account stores instead, so the transaction never expires.
        example: ""
        type: string
      to:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
    type: object
  v2.SystemTransferMaxResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      amount:
        type: string
      amount_sol:
        type: string
      fee:
        type: string
      message:
        type: string
      nonce_authority:
        description: |-
          NonceAuthority is present only when the transaction was built against a
          durable nonce, so it doubles as the signal that RecentBlockhash carries a
          stored value rather than a fetched blockhash.
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
  v2.SystemTransferRequest:
    properties:
      amount:
        example: "1000000"
        type: string
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      from:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      nonce_account:
        description: |-
          NonceAccount may be left empty, in which case a recent blockhash is
          fetched and the transaction expires with it. Naming one builds against
          the value that account stores instead, so the transaction never expires,
          and prepends the advance that consumes it. The authority is not a field:
          it is read from the account, since it is a fact about it rather than a
          choice.
        example: ""
        type: string
      to:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
    type: object
  v2.SystemTransferResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      amount:
        description: |-
          Amount and Fee are strings for the same reason the request's amount is:
          a JSON number is a float, so a lamport count past 2^53 would reach a
          JavaScript client already rounded.
        type: string
      amount_sol:
        type: string
      fee:
        type: string
      message:
        type: string
      nonce_authority:
        description: |-
          NonceAuthority is present only when the transaction was built against a
          durable nonce, so it doubles as the signal that RecentBlockhash carries
          a stored value rather than a fetched blockhash and the transaction does
          not expire. It is reported because the request never named it: advancing
          the nonce is the first instruction and that key has to sign, and the
          server read it off the account.
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
  v2.TransferCheckedRequest:
    properties:
      amount:
        example: "250000"
        type: string
      authority:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      decimals:
        example: 6
        type: integer
      destination:
        example: ""
        type: string
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      mint:
        example: ""
        type: string
      multisig_signers:
        description: |-
          MultisigSigners is empty for a single-signer authority. Non-empty, the
          authority itself does not sign; the named members do, in its place.
        items:
          type: string
        type: array
      nonce_account:
        example: ""
        type: string
      program:
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
      source:
        example: ""
        type: string
    type: object
  v2.TransferCheckedResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      amount:
        type: string
      authority:
        type: string
      decimals:
        type: integer
      destination:
        type: string
      fee:
        type: string
      message:
        type: string
      mint:
        type: string
      nonce_authority:
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      source:
        type: string
      transaction:
        type: string
    type: object
  v2.TransferToWalletRequest:
    properties:
      account:
        description: |-
          Account is the sender's wallet. Its associated token account is
          derived rather than accepted directly, and unlike Destination it is
          never created: an account nobody has funded has nothing to send, so a
          missing source fails rather than being created empty.
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      amount:
        example: "250000"
        type: string
      authority:
        description: |-
          Authority signs for the source account. It is usually Account itself,
          but kept as its own field because it need not be: a delegate approved
          for no more than its delegated amount may sign in Account's place, the
          same rule transfer-checked applies to any source.
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      decimals:
        example: 6
        type: integer
      destination:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      mint:
        example: ""
        type: string
      multisig_signers:
        description: |-
          MultisigSigners is empty for a single-signer authority. Non-empty, the
          authority itself does not sign; the named members do, in its place.
        items:
          type: string
        type: array
      nonce_account:
        example: ""
        type: string
      program:
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
      rent_payer:
        description: |-
          RentPayer covers the rent-exemption deposit if destination's
          associated account does not exist yet, distinct from FeePayer in the
          same way create-ata's is: a caller funding somebody else's account
          need not also be covering the transaction fee.
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
    type: object
  v2.TransferToWalletResponse:
    properties:
      account:
        type: string
      account_keys:
        items:
          type: string
        type: array
      amount:
        type: string
      authority:
        type: string
      created_ata:
        description: |-
          CreatedATA records whether an idempotent create was prepended for the
          destination, since the same request against an already-funded
          destination does not need one. The source associated account is never
          created by this endpoint, so there is nothing equivalent to record for
          it.
        type: boolean
      decimals:
        type: integer
      destination:
        type: string
      destination_associated_account:
        type: string
      fee:
        type: string
      message:
        type: string
      mint:
        type: string
      nonce_authority:
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      rent_exempt:
        type: string
      signers:
        items:
          type: string
        type: array
      source_associated_account:
        type: string
      transaction:
        type: string
    type: object
host: localhost:33153
info:
  contact: {}
  description: Solana transaction API
  title: SVMlab API
  version: "1.0"
paths:
  /svm/account/airdrop:
    post:
      consumes:
      - application/json
      description: Requests a fixed half a SOL. The amount is not a field because
        the faucet enforces its own limit, and asking above it fails the call rather
        than handing out less.
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account.AirdropRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.AirdropResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fund an account on devnet or testnet
      tags:
      - account
  /svm/account/balance:
    post:
      consumes:
      - application/json
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account.AccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.BalanceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read an account's balance
      tags:
      - account
  /svm/account/nonce:
    post:
      consumes:
      - application/json
      description: 'Parses the 80 bytes a nonce account holds. The stored nonce is
        what a transaction may carry in place of a recent blockhash so that it never
        expires, which is the opposite of an EVM nonce: there a per-account counter
        prevents replay, here expiry is what is being removed. An account sized by
        create-account but never initialized is a normal intermediate state and reports
        initialized=false with all-zero fields.'
      parameters:
      - description: Nonce account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account.NonceRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.NonceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read a durable nonce account
      tags:
      - account
  /svm/account/owner:
    post:
      consumes:
      - application/json
      description: Only the owning program may debit an account or write its data.
        An account owned by anything other than the System Program cannot be moved
        with a system transfer, and one owned by a non-executable address cannot be
        moved at all, so system_owned answers whether the balance is still reachable.
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account.AccountOwnerRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.AccountOwnerResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read who owns an account
      tags:
      - account
  /svm/account/state:
    post:
      consumes:
      - application/json
      description: Returns the owner, executable flag, data size, balance, and data.
        An account that does not exist is reported with exists=false rather than as
        an error, since most 32-byte values name one nobody has created.
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account.AccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.AccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read an account's on-chain state
      tags:
      - account
  /svm/account/tokens:
    post:
      consumes:
      - application/json
      description: Lists token accounts owned by a wallet under both the classic Token
        Program and Token-2022. The response keeps the program on each account because
        the two programs own separate accounts and no single token instruction can
        touch both at once.
      parameters:
      - description: Wallet
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account.TokensRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.TokensResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List the token accounts a wallet owns
      tags:
      - account
  /svm/cluster/blockhash:
    post:
      description: Returns the blockhash to build against and the block height past
        which it is rejected, so expiry can be checked rather than guessed. Fetched
        at finalized commitment, since a blockhash from a less settled view risks
        belonging to a fork.
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.BlockhashResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read a recent blockhash
      tags:
      - cluster
  /svm/cluster/genesis-hash:
    post:
      description: A genesis hash is not folded into a signature the way EIP-155 binds
        a chain id, so nothing on chain prevents a transaction from replaying on another
        cluster. Comparing what the endpoint reports against what config names is
        the substitute check.
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.GenesisHashResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read the cluster's genesis hash and compare it to config
      tags:
      - cluster
  /svm/cluster/health:
    post:
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.HealthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read the node's health
      tags:
      - cluster
  /svm/cluster/slot:
    post:
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.SlotResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read the current slot
      tags:
      - cluster
  /svm/cluster/transaction/fee:
    post:
      consumes:
      - application/json
      description: The fee follows from the signature count and any compute budget
        instructions, both of which live in the message, so it is known before signing
        and cannot be exceeded by execution the way a gas estimate can.
      parameters:
      - description: Message
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.FeeRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
