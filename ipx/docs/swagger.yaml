  api_handler_account.TokenAccountResponse:
    properties:
      amount:
        type: string
      close_authority:
        type: string
      decimals:
        type: integer
      delegate:
        type: string
      delegated_amount:
        type: string
      exists:
        type: boolean
      mint:
        type: string
      native:
        type: boolean
      owner:
        type: string
      program:
        type: string
      public_key:
        type: string
      rent_reserve:
        type: string
