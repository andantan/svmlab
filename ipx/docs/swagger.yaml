  /svm/v2/transaction/token/ata/recover-nested:
    post:
      consumes:
      - application/json
      description: 'Moves the balance out of a nested associated token account — one
        created by mistakenly deriving from another associated account as if it were
        a wallet — into wallet''s real associated account for the same mint, and closes
        the nested one. Three addresses are derived internally, none are request fields:
        owner_account is wallet''s associated account for owner_mint (the one mistaken
        for a wallet), nested_account is owner_account''s own associated account for
        nested_mint (the mistake itself, being closed), and destination is wallet''s
        real associated account for nested_mint (where the balance and reclaimed rent
        both end up). wallet signs, since only the real owner may authorize closing
        an account that pays its lamports back there. recent_blockhash is always required
        and is never fetched server-side. Left alone, it also builds the message and
        expires whenever the runtime says it does. Naming durable_nonce_account builds
        the message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
        that case, which has to sign as well.'
