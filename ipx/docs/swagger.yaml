        items:
          type: string
        type: array
      fee:
        type: string
      message:
        type: string
      owner:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
  v2.SystemCreateAccountRequest:
    properties:
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      from:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      lamports:
        example: "890880"
        type: string
      new_account:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
      owner:
        example: "11111111111111111111111111111111"
        type: string
      space:
        example: "0"
        type: string
    type: object
  v2.SystemCreateAccountResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      fee:
        type: string
      lamports:
        type: string
      lamports_sol:
        type: string
      message:
        type: string
      owner:
        type: string
      recent_blockhash:
        type: string
      rent_exempt:
        description: |-
          RentExempt is the floor the requested space had to clear. It is
          reported because the server had to resolve it to validate lamports
          anyway, and it is what a caller needs to know to fund the next one
          without guessing.
        type: string
      signers:
        items:
          type: string
        type: array
      space:
        type: integer
      transaction:
        type: string
    type: object
  v2.SystemSeedAllocateRequest:
    properties:
      base:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      owner:
        example: "11111111111111111111111111111111"
        type: string
      seed:
        example: vault-1
        type: string
      space:
        example: "165"
        type: string
    type: object
  v2.SystemSeedAllocateResponse:
