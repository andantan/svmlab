  v1.BuildTransactionRequest:
    properties:
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      instructions:
        items:
          $ref: '#/definitions/v1.Instruction'
        type: array
      recent_blockhash:
        description: |-
          RecentBlockhash may be left empty, in which case it is fetched from the
          cluster. Supplying it makes the call deterministic, which is what allows
          the same request to reproduce identical bytes.
        example: ""
        type: string
    type: object
  v1.BuildTransactionResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      header:
        $ref: '#/definitions/v1.Header'
      message:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      size:
        type: integer
      transaction:
        type: string
    type: object
  v1.Header:
    properties:
      num_readonly_signed_accounts:
        type: integer
      num_readonly_unsigned_accounts:
        type: integer
      num_required_signatures:
        type: integer
    type: object
  v1.Instruction:
    properties:
      accounts:
        items:
          $ref: '#/definitions/v1.Account'
        type: array
      data:
        example: AgAAAECcAAAAAAAA
        type: string
      program_id:
        example: "11111111111111111111111111111111"
        type: string
    type: object
  v2.ATARecoverNestedRequest:
    properties:
      durable_nonce_account:
        description: |-
          DurableNonceAccount may be left empty, in which case the message is
          built against RecentBlockhash directly and expires with it. Naming one
          builds the message against the value that account stores instead, so it
          never expires, and prepends the advance that consumes it; RecentBlockhash
          is then used only to price the transaction. The authority is not a
          field: it is read from the account, since it is a fact about it rather
          than a choice.
        example: ""
        type: string
      fee_payer:
        description: |-
          FeePayer signs and pays the transaction fee. It may be the same
          account as Wallet.
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      nested_mint:
        description: |-
          NestedMint is the mint of the nested account itself, the one being
          recovered and closed. It must differ from OwnerMint.
        example: ""
        type: string
      owner_mint:
        description: |-
          OwnerMint is the mint of the associated account that was mistakenly
          used as a wallet — deriving Wallet's associated account for OwnerMint
          is what produced the address the nested account was wrongly created
          under.
        example: ""
        type: string
      program:
        description: |-
          Program is a seed of every derived address, so one wallet has
          different owner, nested, and destination accounts for classic Token
          than for Token-2022 over the same mints.
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
      recent_blockhash:
        description: |-
          RecentBlockhash is always required, and there is no server-side fetch
          behind it: this builds the message against exactly the value given,
          which expires whenever the runtime says it does. When
          DurableNonceAccount is also named, this is not what the message is
          built against — it is only what prices it, since a nonce is never among
          the cluster's recent blockhashes and pricing against one directly comes
          back expired.
        example: ""
        type: string
      wallet:
        description: |-
          Wallet is the real owner, and the only one who signs: closing the
          nested account pays its reclaimed lamports back to Wallet's own
          associated account for OwnerMint, so only the real owner may authorize
          that.
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
    type: object
  v2.ATARecoverNestedResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      destination:
        type: string
      fee:
        $ref: '#/definitions/v2.SystemPayer'
      message:
        type: string
      nested_account:
        type: string
      nested_mint:
        type: string
      nonce_authority:
        type: string
      owner_account:
        type: string
      owner_mint:
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
      wallet:
        type: string
    type: object
  v2.ApproveCheckedMaxRequest:
    properties:
      delegate:
        description: |-
          Delegate is who may spend from TokenAccount going forward, up to the
          maximum representable amount, replacing any prior delegation entirely
          rather than adding to it.
        example: ""
        type: string
      durable_nonce_account:
        description: |-
          DurableNonceAccount may be left empty, in which case the message is
          built against RecentBlockhash directly and expires with it. Naming one
          builds the message against the value that account stores instead, so it
          never expires, and prepends the advance that consumes it; RecentBlockhash
          is then used only to price the transaction. The authority is not a
          field: it is read from the account, since it is a fact about it rather
          than a choice.
        example: ""
        type: string
      fee_payer:
        description: FeePayer signs and pays the transaction fee.
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      mint:
        description: Mint is what TokenAccount must hold.
        example: ""
        type: string
      multisig_signers:
        description: |-
          MultisigSigners is empty for a single-signer authority. Non-empty, the
          authority itself does not sign; the named members do, in its place.
        items:
          type: string
        type: array
      program:
        description: |-
          Program names the account to send the instruction to: classic Token or
          Token-2022. It is required rather than defaulted, since a token
          account belongs to exactly one of the two forever, and it must agree
          with the mint's own owning program or the instruction fails on chain.
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
      recent_blockhash:
        description: |-
          RecentBlockhash is always required, and there is no server-side fetch
          behind it: this builds the message against exactly the value given,
          which expires whenever the runtime says it does. When
          DurableNonceAccount is also named, this is not what the message is
          built against — it is only what prices it, since a nonce is never among
          the cluster's recent blockhashes and pricing against one directly comes
          back expired.
        example: ""
        type: string
      token_account:
        description: |-
          TokenAccount is debited if the delegation is ever spent. It must
          already exist and hold Mint.
        example: ""
        type: string
      token_account_owner:
        description: |-
          TokenAccountOwner must be TokenAccount's owner, never an existing
          delegate: re-delegating would let a delegate hand its own spending
          rights to a third party the owner never chose.
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
    type: object
  v2.ApproveCheckedMaxResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      decimals:
        type: integer
      delegate:
        type: string
      fee:
        $ref: '#/definitions/v2.SystemPayer'
      max_amount:
        type: string
      message:
        type: string
      mint:
        type: string
      nonce_authority:
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      token_account:
        type: string
      token_account_owner:
        type: string
      transaction:
        type: string
    type: object
  v2.ApproveCheckedRequest:
    properties:
      amount:
        description: |-
          Amount is the raw base-unit count Delegate may spend, not a UI decimal
          string.
        example: "500000"
        type: string
      decimals:
        description: |-
