      amount:
        type: string
      amount_sol:
        type: string
      derived_address:
        type: string
      fee:
        type: string
      message:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
  v2.SystemTransferMaxRequest:
    properties:
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      from:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      to:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
