  /svm/v2/transaction/token/approve-checked/max:
    post:
      consumes:
      - application/json
      description: Same as approve-checked, except the amount granted is always the
        maximum representable base-unit value rather than a caller-given one — the
        standard effectively-unlimited approval, since that value is far beyond any
        real balance and never needs re-approving as the balance changes. The delegate
        can still only ever move what token_account actually holds; the amount here
        is a ceiling, not a balance. decimals is never a request field, since there
        is no client-computed amount to protect against a wrong decimals assumption;
        the mint's own value is used to build the instruction directly. Only token_account_owner
        may approve, never an existing delegate, so re-delegating is not possible
        through this endpoint. recent_blockhash is always required and is never fetched
        server-side. Left alone, it also builds the message and expires whenever the
        runtime says it does. Naming durable_nonce_account builds the message against
        the value that account stores instead, so the transaction never expires, and
        prepends the advance that consumes it; recent_blockhash then only prices the
        transaction. The response reports nonce_authority in that case, which has
        to sign as well.
      parameters:
      - description: Cluster name
        in: header
