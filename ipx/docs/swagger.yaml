  /svm/rpc/transaction/send:
    post:
      consumes:
      - application/json
      description: Submits a fully signed transaction to the cluster and returns its
        signature. Acceptance is not execution; the transaction still has to land
        in a block.
      parameters:
      - description: Signed transaction
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.SendTransactionRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.SendTransactionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Broadcast a signed transaction
      tags:
      - rpc
  /svm/rpc/transaction/simulate:
    post:
      consumes:
      - application/json
      description: Runs a fully signed transaction against the node's state without
        broadcasting it, and returns the program logs either way. The logs are the
        only account of why execution stopped; nothing here corresponds to a revert
        string.
      parameters:
      - description: Transaction
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.SimulateTransactionRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.SimulateTransactionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Execute a transaction without submitting it
      tags:
      - rpc
  /svm/rpc/transaction/status:
    post:
      consumes:
      - application/json
      description: 'Stands in for an EVM receipt, but found can stay false forever:
        a transaction whose blockhash expired is forgotten and never lands.'
      parameters:
      - description: Signature
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.SignatureStatusRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.SignatureStatusResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read a transaction's status
      tags:
      - rpc
  /svm/rpc/version:
    post:
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.VersionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read the node's software version
      tags:
      - rpc
  /svm/sign:
    post:
      consumes:
      - application/json
      description: 'Signs the given bytes with a key resolved from config.yaml and
        returns the bare signature, assembling nothing around it. The input is the
        message itself, not a digest: ed25519 hashes internally, so a pre-hashed input
        yields a signature no verifier holding the real message can check. Pass the
        message field a build returns to reproduce what the transaction signer does.'
      parameters:
      - description: Signer public key and message
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.SignRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.SignResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sign arbitrary bytes
      tags:
      - sign
  /svm/sign/transaction:
    post:
      consumes:
      - application/json
      description: Signs the message inside a serialized transaction and writes each
        signature into its signer's slot, found from the key rather than from the
        order given. The message is never rebuilt, so the bytes a caller signs are
        exactly the bytes they were given. public_keys are resolved from config.yaml
        and private_keys carry the secret directly, for a signer such as a newly created
        account that is not registered; the two may be mixed in one call. Keys may
        also be named across several calls, so co-signers can complete a transaction
        one at a time.
      parameters:
      - description: Transaction and its signers
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.SignTransactionRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.SignTransactionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sign a serialized transaction
      tags:
      - sign
  /svm/sign/verify:
    post:
      consumes:
      - application/json
      description: Checks a signature against a message and a public key. The key
        is required and cannot be recovered from the signature, since ed25519 offers
        no equivalent of ecrecover. Any key may be given, not only one from config.
      parameters:
      - description: Public key, message, and signature
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/misc.VerifyRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.VerifyResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify a signature
      tags:
      - sign
  /svm/tool/generate/keypair:
    post:
      description: 'Returns a new key pair in the base58 form config.yaml expects,
        so it can be added as a keys entry and used as a signer. Nothing is written
        or funded: the address does not exist on any cluster until a transaction creates
        it, which is what makes a fresh pair usable as the new_account of a create-account
        build.'
      parameters:
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.GenerateKeypairResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Generate an ed25519 key pair
      tags:
      - tool
  /svm/v1/transaction/build:
    post:
      consumes:
      - application/json
      description: Compiles instructions into a message and returns the unsigned transaction,
        the message bytes every signer signs, and the account ordering the compilation
        produced
      parameters:
      - description: Fee payer, blockhash, and instructions
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.BuildTransactionRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.BuildTransactionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build an unsigned transaction
      tags:
      - transaction
  /svm/v2/transaction/system/allocate:
    post:
      consumes:
      - application/json
      description: Reserves data space on an existing System-owned account. Only the
        owning program may size an account, so this works on an account the System
        Program still owns and not one already assigned elsewhere. Growing an account
        raises its rent-exempt floor, so the balance is checked against the minimum
        for the new size rather than the old one.
      parameters:
      - description: Account and space
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemAllocateRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemAllocateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a System Program allocation
      tags:
      - transaction
  /svm/v2/transaction/system/assign:
    post:
      consumes:
      - application/json
      description: 'Hands a System-owned account to another program, which is the
        step that puts an account under a program''s control. Ownership is a field
        on the account rather than a mapping the program keeps, which is the inverse
        of an EVM contract holding balances for its users in its own storage. The
        owner must be executable: only the owning program may debit an account or
        write its data, so assigning to a plain address locks the account and its
        lamports permanently.'
      parameters:
      - description: Account and new owner
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemAssignRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemAssignResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a System Program ownership assignment
      tags:
      - transaction
  /svm/v2/transaction/system/create-account:
    post:
      consumes:
      - application/json
      description: 'Funds a new account, sizes its data, and assigns it an owner.
        The owner must be executable: only the owning program may debit an account
        or write its data, so an account owned by a plain address is locked from the
        moment it exists. Pass the System Program for an ordinary account. The new
        account signs alongside the funder, which is what has no EVM counterpart:
        an address does not exist until someone holding its private key authorizes
        its creation. Lamports must reach the rent-exempt minimum for the requested
        space, which this checks before returning.'
      parameters:
      - description: Funder, new account, owner, lamports, and space
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemCreateAccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemCreateAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a System Program account creation
      tags:
      - transaction
  /svm/v2/transaction/system/seed/allocate:
    post:
      consumes:
      - application/json
      description: Reserves data space on SHA256(base || seed || owner) with base
        signing in the account's place. Allocation still requires the account to be
        System-owned, so this is the step taken before assigning it away, on an address
        derived for its eventual owner from the start. Growing an account raises its
        rent-exempt floor, so the balance is checked against the minimum for the new
        size.
      parameters:
      - description: Base, seed, owner, and space
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemSeedAllocateRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemSeedAllocateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build an allocation on a seed-derived address
      tags:
      - transaction
  /svm/v2/transaction/system/seed/assign:
    post:
      consumes:
      - application/json
      description: 'Hands SHA256(base || seed || owner) to that same owner. There
        is no separate new-owner field, because one owner does both jobs: it is what
        the address is derived from and what the account is assigned to, so an account
        can only be handed to the program its own address already encodes. The owner
        must be executable, since assigning to a plain address locks the account permanently.'
      parameters:
      - description: Base, seed, and owner
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemSeedAssignRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemSeedAssignResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build an ownership assignment on a seed-derived address
      tags:
      - transaction
  /svm/v2/transaction/system/seed/create-account:
    post:
      consumes:
      - application/json
      description: 'Creates an account at SHA256(base || seed || owner) and hands
        it to that owner in one instruction, so a program-owned account needs no separate
        allocate and assign. The owner must be executable, and it changes the address:
        the same base and seed derive somewhere else for a different owner. The derived
        account never signs, which is the difference from create-account: nobody holds
        a secret for it, so base signs in its place and whoever controls base controls
        every address derived from it. The address is derived rather than accepted,
        since the runtime recomputes it and rejects a mismatch.'
      parameters:
      - description: Funder, base, seed, owner, lamports, and space
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemSeedCreateAccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemSeedCreateAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build an account creation at a seed-derived address
      tags:
      - transaction
  /svm/v2/transaction/system/seed/transfer:
    post:
      consumes:
      - application/json
      description: 'Debits SHA256(base || seed || owner) without that account signing,
        since base signs for it. That is what makes a derived address usable as a
        holding account: anyone can fund it, and only the holder of base can spend
        it. The account must still be System-owned for a system transfer to debit
        it, which is checked before returning.'
      parameters:
      - description: Base, seed, owner, recipient, and amount
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemSeedTransferRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemSeedTransferResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a transfer out of a seed-derived address
      tags:
      - transaction
  /svm/v2/transaction/system/seed/transfer/max:
    post:
      consumes:
      - application/json
      description: 'Sends everything SHA256(base || seed || owner) holds. The amount
        is the whole balance with nothing held back, because a derived address can
        never pay the fee: a fee payer has to sign, and this account cannot. That
        also means no probe is needed to price the message first, since the amount
        does not depend on the fee here the way it does for a plain transfer. Emptying
        the account lets the runtime reclaim it.'
      parameters:
      - description: Base, seed, owner, and recipient
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemSeedTransferMaxRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemSeedTransferMaxResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a transfer of a seed-derived address's entire balance
      tags:
      - transaction
  /svm/v2/transaction/system/transfer:
    post:
      consumes:
      - application/json
      description: Assembles a System Program transfer and returns the same shape
        as a v1 build, so sign and send accept it unchanged. The recent blockhash
        is always fetched, and the recipient is not required to exist yet. To send
        the sender's entire balance, use transfer/max instead.
      parameters:
      - description: Sender, recipient, and amount
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemTransferRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemTransferResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a native SOL transfer
      tags:
      - transaction
  /svm/v2/transaction/system/transfer/max:
    post:
      consumes:
      - application/json
      description: Assembles a System Program transfer moving everything the sender
        can send. Resolving that amount needs the sender's balance and the fee, both
        fetched from the chain. The fee only comes out of the sender's balance when
        the sender is also the fee payer; with a separate fee payer the whole balance
        can go, which empties the account and lets the runtime reclaim it.
      parameters:
      - description: Sender and recipient
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemTransferMaxRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemTransferMaxResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a native SOL transfer of the sender's entire balance
      tags:
      - transaction
swagger: "2.0"
