          schema:
            additionalProperties:
              type: string
            type: object
      summary: Generate an ed25519 key pair
      tags:
      - tool
  /svm/v1/transaction/build:
    post:
      consumes:
      - application/json
      description: Compiles instructions into a message and returns the unsigned transaction,
        the message bytes every signer signs, and the account ordering the compilation
        produced
      parameters:
