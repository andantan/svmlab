      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/misc.RentExemptionTokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Minimum balance for an SPL Token account
      tags:
      - rpc
  /svm/rpc/rent-exemption/vote:
    post:
      parameters:
      - description: Chain name, e.g. solana
