  /svm/v2/transaction/token/create-kta:
    post:
      consumes:
      - application/json
      description: 'System CreateAccount only, sized and owned for a holder account
        but not initialized. This is deliberately the low-level half: nothing stops
        somebody else from initializing the account first, naming their own wallet
        as owner, in between this transaction and the next; a caller who wants that
        race closed should build create+initialize as two instructions in one transaction
        themselves. Initializing is a separate call: initialize-account3, or initialize-account/initialize-account2
        for the original opcodes. This produces a plain keypair account rather than
        an associated one (see create-ata): the address is whatever key was generated
        for it, and nothing can rediscover it from the wallet and mint the way an
        associated token account can be. recent_blockhash is always required and is
        never fetched server-side. Left alone, it also builds the message and expires
        whenever the runtime says it does. Naming durable_nonce_account builds the
        message against the value that account stores instead, so the transaction
        never expires, and prepends the advance that consumes it; recent_blockhash
        then only prices the transaction. The response reports nonce_authority in
