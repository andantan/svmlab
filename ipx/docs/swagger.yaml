      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.BuildTransactionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build an unsigned transaction
      tags:
      - transaction
  /svm/v2/transaction/system/allocate:
    post:
      consumes:
      - application/json
      description: Reserves data space on an existing System-owned account. Only the
        owning program may size an account, so this works on an account the System
        Program still owns and not one already assigned elsewhere. Growing an account
        raises its rent-exempt floor, so the balance is checked against the minimum
        for the new size rather than the old one. Naming nonce_account builds the
        transaction against the value that durable nonce account stores rather than
        a recent blockhash, so it never expires; the advance that consumes it is prepended
        as the first instruction, and the response reports nonce_authority, which
        has to sign as well.
      parameters:
      - description: Account and space
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemAllocateRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemAllocateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a System Program allocation
      tags:
      - transaction
  /svm/v2/transaction/system/assign:
    post:
      consumes:
      - application/json
      description: 'Hands a System-owned account to another program, which is the
        step that puts an account under a program''s control. Ownership is a field
        on the account rather than a mapping the program keeps, which is the inverse
        of an EVM contract holding balances for its users in its own storage. The
        owner must be executable: only the owning program may debit an account or
        write its data, so assigning to a plain address locks the account and its
        lamports permanently. Naming nonce_account builds the transaction against
        the value that durable nonce account stores rather than a recent blockhash,
        so it never expires; the advance that consumes it is prepended as the first
        instruction, and the response reports nonce_authority, which has to sign as
        well.'
      parameters:
      - description: Account and new owner
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemAssignRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemAssignResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a System Program ownership assignment
      tags:
      - transaction
  /svm/v2/transaction/system/create-account:
    post:
      consumes:
      - application/json
      description: 'Funds a new account, sizes its data, and assigns it an owner.
        The owner must be executable: only the owning program may debit an account
        or write its data, so an account owned by a plain address is locked from the
        moment it exists. Pass the System Program for an ordinary account. The new
        account signs alongside the funder, which is what has no EVM counterpart:
        an address does not exist until someone holding its private key authorizes
        its creation. Lamports must reach the rent-exempt minimum for the requested
        space, which this checks before returning. Naming nonce_account builds the
        transaction against the value that durable nonce account stores rather than
        a recent blockhash, so it never expires; the advance that consumes it is prepended
        as the first instruction, and the response reports nonce_authority, which
        has to sign as well.'
      parameters:
      - description: Funder, new account, owner, lamports, and space
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemCreateAccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemCreateAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a System Program account creation
      tags:
      - transaction
  /svm/v2/transaction/system/nonce/advance:
    post:
      consumes:
      - application/json
      description: 'Replaces the stored nonce with the current blockhash. Advancing
        is what consumes a nonce: a transaction built against one carries it in place
        of a recent blockhash and runs this as its first instruction, so the value
        it was built for is gone by the time it finishes and it cannot land twice.
        Run on its own, this simply invalidates anything already built against the
        account. The authority signs, and the stored authority is checked here rather
        than left to fail on chain. Naming nonce_account builds the transaction against
        the value that durable nonce account stores rather than a recent blockhash,
        so it never expires; the advance that consumes it is prepended as the first
        instruction, and the response reports nonce_authority, which has to sign as
        well. It has to be an account other than the one this endpoint acts on.'
      parameters:
      - description: Target nonce account and authority
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemNonceAdvanceRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemNonceAdvanceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a durable nonce advance
      tags:
      - transaction
  /svm/v2/transaction/system/nonce/authorize:
    post:
      consumes:
      - application/json
      description: Hands control of a nonce account to another key. The stored nonce
        and the balance are untouched, so only who may advance and withdraw changes.
        That also invalidates anything the old authority signed but never submitted,
        since such a transaction advances the nonce as its first instruction and that
        now needs a signature the old authority cannot give. If the reason for changing
        is a leaked key, the old authority's pending transaction and this one race,
        so pair it with an advance. Naming nonce_account builds the transaction against
        the value that durable nonce account stores rather than a recent blockhash,
        so it never expires; the advance that consumes it is prepended as the first
        instruction, and the response reports nonce_authority, which has to sign as
        well. It has to be an account other than the one this endpoint acts on.
      parameters:
      - description: Target nonce account, current authority, and new authority
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemNonceAuthorizeRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemNonceAuthorizeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a durable nonce authority change
      tags:
      - transaction
  /svm/v2/transaction/system/nonce/create-account:
    post:
      consumes:
      - application/json
      description: 'Creates the account and initializes it as a durable nonce in one
        transaction, which is the first v2 endpoint to carry more than one instruction.
        The nonce account appears twice: it signs for the creation, since an address
        does not exist until its key authorizes it, and is only writable for the initialization,
        which needs no authority. Message compilation lists it once with the union
        of both, which is why it shows up among the signers. Size and funding are
        not fields, since a nonce account is always the same size and has to hold
        exactly the rent-exempt minimum for it. Naming nonce_account builds the transaction
        against the value that durable nonce account stores rather than a recent blockhash,
        so it never expires; the advance that consumes it is prepended as the first
        instruction, and the response reports nonce_authority, which has to sign as
        well. It has to be an account other than the one this endpoint acts on.'
      parameters:
      - description: Funder, new nonce account, and authority
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemNonceCreateRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemNonceCreateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a durable nonce account creation
      tags:
      - transaction
  /svm/v2/transaction/system/nonce/initialize:
    post:
      consumes:
      - application/json
      description: 'Initializes an account that already exists and is already the
        right size. nonce/create-account does this and the creation together, so this
        is for an address that can no longer be created: CreateAccount refuses one
        that already holds lamports, which is what happens when someone funds the
        address first. The account is writable but does not sign, since initializing
        it needs no authority of its own; it gains the authority named here. Naming
        nonce_account builds the transaction against the value that durable nonce
        account stores rather than a recent blockhash, so it never expires; the advance
        that consumes it is prepended as the first instruction, and the response reports
        nonce_authority, which has to sign as well. It has to be an account other
        than the one this endpoint acts on.'
      parameters:
      - description: New nonce account and authority
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemNonceInitializeRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemNonceInitializeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a durable nonce initialization on an existing account
      tags:
      - transaction
  /svm/v2/transaction/system/nonce/upgrade:
    post:
      consumes:
      - application/json
      description: 'Rewrites a Legacy nonce account as the current version. Legacy
        accounts stored the blockhash itself, which could collide with a real one;
        the current version stores a value derived from it that cannot. Nothing signs,
        since this is not a privileged operation, so anyone willing to pay the fee
        may upgrade anyone''s account. No account this project creates can be upgraded:
        initialize has written the current version for a long time, only accounts
        predating that change are Legacy, and no instruction can produce one now.
        The check below rejects a current account before it reaches the chain. Naming
        nonce_account builds the transaction against the value that durable nonce
        account stores rather than a recent blockhash, so it never expires; the advance
        that consumes it is prepended as the first instruction, and the response reports
        nonce_authority, which has to sign as well. It has to be an account other
        than the one this endpoint acts on.'
      parameters:
      - description: Target nonce account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemNonceUpgradeRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemNonceUpgradeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a Legacy nonce account migration
      tags:
      - transaction
  /svm/v2/transaction/system/nonce/withdraw:
    post:
      consumes:
      - application/json
      description: Moves part of a nonce account's balance out. What stays has to
        keep the account rent exempt at its size, since an account below that floor
        is subject to removal while still holding a nonce something may have been
        built against. Taking the whole balance closes the account and carries a further
        rule, so that has its own endpoint. The authority signs, and the stored authority
        is checked here rather than left to fail on chain. Naming nonce_account builds
        the transaction against the value that durable nonce account stores rather
        than a recent blockhash, so it never expires; the advance that consumes it
        is prepended as the first instruction, and the response reports nonce_authority,
        which has to sign as well. It has to be an account other than the one this
        endpoint acts on.
      parameters:
      - description: Target nonce account, authority, recipient, and amount
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemNonceWithdrawRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemNonceWithdrawResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a partial withdrawal from a durable nonce account
      tags:
      - transaction
  /svm/v2/transaction/system/nonce/withdraw/max:
    post:
      consumes:
      - application/json
      description: 'Takes the whole balance, which closes the account. The rent-exempt
        floor that constrains a partial withdrawal does not apply, since nothing is
        left to keep exempt. One rule replaces it and is not checked here: the runtime
        refuses to close an account whose stored nonce is still the blockhash the
        transaction executes against, so closing in the same block the nonce was last
        advanced or initialized fails with NonceBlockhashNotExpired. That cannot be
        decided before submitting, because the blockhash it is compared against is
        the one at execution rather than any this build could see. Waiting a block
        and rebuilding is the fix. Naming nonce_account builds the transaction against
        the value that durable nonce account stores rather than a recent blockhash,
        so it never expires; the advance that consumes it is prepended as the first
        instruction, and the response reports nonce_authority, which has to sign as
        well. It has to be an account other than the one this endpoint acts on.'
      parameters:
      - description: Target nonce account, authority, and recipient
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemNonceWithdrawMaxRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemNonceWithdrawMaxResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a full withdrawal that closes a durable nonce account
      tags:
      - transaction
  /svm/v2/transaction/system/seed/allocate:
    post:
      consumes:
      - application/json
      description: Reserves data space on SHA256(base || seed || owner) with base
        signing in the account's place. Allocation still requires the account to be
        System-owned, so this is the step taken before assigning it away, on an address
        derived for its eventual owner from the start. Growing an account raises its
        rent-exempt floor, so the balance is checked against the minimum for the new
        size. Naming nonce_account builds the transaction against the value that durable
        nonce account stores rather than a recent blockhash, so it never expires;
        the advance that consumes it is prepended as the first instruction, and the
        response reports nonce_authority, which has to sign as well.
      parameters:
      - description: Base, seed, owner, and space
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemSeedAllocateRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemSeedAllocateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build an allocation on a seed-derived address
      tags:
      - transaction
  /svm/v2/transaction/system/seed/assign:
    post:
      consumes:
      - application/json
      description: 'Hands SHA256(base || seed || owner) to that same owner. There
        is no separate new-owner field, because one owner does both jobs: it is what
        the address is derived from and what the account is assigned to, so an account
        can only be handed to the program its own address already encodes. The owner
        must be executable, since assigning to a plain address locks the account permanently.
        Naming nonce_account builds the transaction against the value that durable
        nonce account stores rather than a recent blockhash, so it never expires;
        the advance that consumes it is prepended as the first instruction, and the
        response reports nonce_authority, which has to sign as well.'
      parameters:
      - description: Base, seed, and owner
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemSeedAssignRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemSeedAssignResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build an ownership assignment on a seed-derived address
      tags:
      - transaction
  /svm/v2/transaction/system/seed/create-account:
    post:
      consumes:
      - application/json
      description: 'Creates an account at SHA256(base || seed || owner) and hands
        it to that owner in one instruction, so a program-owned account needs no separate
        allocate and assign. The owner must be executable, and it changes the address:
        the same base and seed derive somewhere else for a different owner. The derived
        account never signs, which is the difference from create-account: nobody holds
        a secret for it, so base signs in its place and whoever controls base controls
        every address derived from it. The address is derived rather than accepted,
        since the runtime recomputes it and rejects a mismatch. Naming nonce_account
        builds the transaction against the value that durable nonce account stores
        rather than a recent blockhash, so it never expires; the advance that consumes
        it is prepended as the first instruction, and the response reports nonce_authority,
        which has to sign as well.'
      parameters:
      - description: Funder, base, seed, owner, lamports, and space
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemSeedCreateAccountRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemSeedCreateAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build an account creation at a seed-derived address
      tags:
      - transaction
  /svm/v2/transaction/system/seed/transfer:
    post:
      consumes:
      - application/json
      description: 'Debits SHA256(base || seed || owner) without that account signing,
        since base signs for it. That is what makes a derived address usable as a
        holding account: anyone can fund it, and only the holder of base can spend
        it. The account must still be System-owned for a system transfer to debit
        it, which is checked before returning. Naming nonce_account builds the transaction
        against the value that durable nonce account stores rather than a recent blockhash,
        so it never expires; the advance that consumes it is prepended as the first
        instruction, and the response reports nonce_authority, which has to sign as
        well.'
      parameters:
      - description: Base, seed, owner, recipient, and amount
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemSeedTransferRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemSeedTransferResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a transfer out of a seed-derived address
      tags:
      - transaction
  /svm/v2/transaction/system/seed/transfer/max:
    post:
      consumes:
      - application/json
      description: 'Sends everything SHA256(base || seed || owner) holds. The amount
        is the whole balance with nothing held back, because a derived address can
        never pay the fee: a fee payer has to sign, and this account cannot. That
        also means no probe is needed to price the message first, since the amount
        does not depend on the fee here the way it does for a plain transfer. Emptying
        the account lets the runtime reclaim it. Naming nonce_account builds the transaction
        against the value that durable nonce account stores rather than a recent blockhash,
        so it never expires; the advance that consumes it is prepended as the first
        instruction, and the response reports nonce_authority, which has to sign as
        well.'
      parameters:
      - description: Base, seed, owner, and recipient
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemSeedTransferMaxRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemSeedTransferMaxResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a transfer of a seed-derived address's entire balance
      tags:
      - transaction
  /svm/v2/transaction/system/transfer:
    post:
      consumes:
      - application/json
      description: Assembles a System Program transfer and returns the same shape
        as a v1 build, so sign and send accept it unchanged. The recent blockhash
        is always fetched, and the recipient is not required to exist yet. To send
        the sender's entire balance, use transfer/max instead. Naming nonce_account
        builds the transaction against the value that durable nonce account stores
        rather than a recent blockhash, so it never expires; the advance that consumes
        it is prepended as the first instruction, and the response reports nonce_authority,
        which has to sign as well.
      parameters:
      - description: Sender, recipient, and amount
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemTransferRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemTransferResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a native SOL transfer
      tags:
      - transaction
  /svm/v2/transaction/system/transfer/batch:
    post:
      consumes:
      - application/json
      description: Assembles one Transfer instruction per entry, each with its own
        sender, in a single transaction. Every distinct sender signs, and a signature
        costs 64 bytes beside its 32 byte account key, so senders are three times
        as expensive as recipients and this fits far fewer transfers than transfer/many
        does. Naming a sender as the fee payer costs nothing, since it already signs;
        naming anyone else adds another 96 bytes. An entry may set max instead of
        amount to send whatever its sender still holds once its other entries and,
        if it is also the fee payer, the fee are taken out, which is a figure the
        request cannot state because the fee is not known until the transaction is
        priced. One max per sender, since everything an account holds cannot go to
        two places. Collecting a signature from every sender takes longer than a blockhash
        lasts, so naming nonce_account builds the transaction against the value that
        durable nonce account stores instead, and it never expires; the advance that
        consumes it is prepended as the first instruction, and the response reports
        nonce_authority, which has to sign as well.
      parameters:
      - description: Transfers with their own senders, and a fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemTransferBatchRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemTransferBatchResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build one transaction paying from several accounts
      tags:
      - transaction
  /svm/v2/transaction/system/transfer/many:
    post:
      consumes:
      - application/json
      description: 'Assembles one Transfer instruction per recipient, all leaving
        the same account, in a single transaction. This is the first endpoint to carry
        an arbitrary number of instructions, so it is the first bounded by transaction
        size rather than by anything it checks: a transaction travels in one 1232-byte
        packet and cannot be split, which caps the list somewhere around twenty and
        is reported as size and size_limit. The account keys show fewer entries than
        instructions, since the sender and the System Program appear in every one
        and a compiled message lists each key once. There is no max variant, because
        sending everything one account holds does not say how to divide it. Naming
        nonce_account builds the transaction against the value that durable nonce
        account stores rather than a recent blockhash, so it never expires; the advance
        that consumes it is prepended as the first instruction, and the response reports
        nonce_authority, which has to sign as well.'
      parameters:
      - description: Sender, recipients with amounts, and fee payer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemTransferManyRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemTransferManyResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build one transaction paying several recipients
      tags:
      - transaction
  /svm/v2/transaction/system/transfer/max:
    post:
      consumes:
      - application/json
      description: Assembles a System Program transfer moving everything the sender
        can send. Resolving that amount needs the sender's balance and the fee, both
        fetched from the chain. The fee only comes out of the sender's balance when
        the sender is also the fee payer; with a separate fee payer the whole balance
        can go, which empties the account and lets the runtime reclaim it. Naming
        nonce_account builds the transaction against the value that durable nonce
        account stores rather than a recent blockhash, so it never expires; the advance
        that consumes it is prepended as the first instruction, and the response reports
        nonce_authority, which has to sign as well.
      parameters:
      - description: Sender and recipient
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.SystemTransferMaxRequest'
      - description: Chain name, e.g. solana
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Chain network, e.g. testnet
        in: header
        name: X-Chain-Network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.SystemTransferMaxResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Build a native SOL transfer of the sender's entire balance
      tags:
      - transaction
  /svm/v2/transaction/token/burn-checked:
    post:
      consumes:
      - application/json
      description: Reduces the mint's total supply and the account's balance together.
        decimals is checked against the mint rather than filled in from it, catching
        a client that formatted amount against the wrong decimals as a 400 instead
        of an on-chain failure. authority must be the account's owner, or its delegate
        for no more than the delegated amount — the mint's own authority has no say
        over what a holder chooses to burn.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Burn parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.BurnCheckedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.BurnCheckedResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Destroy supply held by a token account
      tags:
      - transaction
  /svm/v2/transaction/token/close-account:
    post:
      consumes:
      - application/json
      description: The account must already hold no tokens; the balance is not swept,
        it has to be zero. A wrapped SOL account is the exception, since its lamports
        are its balance, and closing it is how SOL is unwrapped. authority must be
        the account's owner or its close authority. The reclaimed lamports go to destination.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Close parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.CloseAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.CloseAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Close a token account and reclaim its rent
      tags:
      - transaction
  /svm/v2/transaction/token/create-account:
    post:
      consumes:
      - application/json
      description: System CreateAccount and InitializeAccount3 as one transaction.
        An uninitialized Token-owned account initialized by somebody else names their
        wallet as owner, which is why the two never exist as separate endpoints.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Token account parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.CreateAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fund and initialize an SPL Token holder account
      tags:
      - transaction
  /svm/v2/transaction/token/create-ata:
    post:
      consumes:
      - application/json
      description: 'Derives the associated token address and creates it. The address
        is not a request field: it follows from wallet, mint, and program, so nothing
        generates a keypair for it and nothing has to remember it. The account itself
        does not sign, unlike a keypair token account, because a program derived address
        has no private key. Fails if the account already exists; use create-ata-idempotent
        when that is not known in advance.'
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Associated account parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.CreateATARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.CreateATAResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create the canonical token account for a wallet and mint
      tags:
      - transaction
  /svm/v2/transaction/token/create-ata-idempotent:
    post:
      consumes:
      - application/json
      description: 'Same as create-ata, except the instruction succeeds rather than
        fails when the account is already there. This is the one to prepend to a transfer:
        checking first and creating only if absent leaves a window in which somebody
        else creates it, and the plain create would then fail the whole transaction
        over an account that exists and is correct.'
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Associated account parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.CreateATAIdempotentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.CreateATAIdempotentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create the canonical token account, succeeding if it exists
      tags:
      - transaction
  /svm/v2/transaction/token/create-mint:
    post:
      consumes:
      - application/json
      description: System CreateAccount and InitializeMint2 as one transaction. An
        uninitialized Token-owned account can be initialized by anybody else before
        its intended owner does, so the two never exist as separate endpoints.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Mint parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.CreateMintRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.CreateMintResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fund and initialize an SPL Token mint
      tags:
      - transaction
  /svm/v2/transaction/token/mint-to-checked:
    post:
      consumes:
      - application/json
      description: Creates new supply and credits an existing token account. decimals
        is checked against the mint rather than filled in from it, which is what catches
        a client that formatted amount against the wrong decimals as a 400 instead
        of an on-chain failure.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Mint-to parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.MintToCheckedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.MintToCheckedResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Mint new supply into a token account
      tags:
      - transaction
  /svm/v2/transaction/token/transfer-checked:
    post:
      consumes:
      - application/json
      description: Transfers between token accounts, never to a wallet address directly.
        decimals is checked against the mint rather than filled in from it, catching
        a client that formatted amount against the wrong decimals as a 400 instead
        of an on-chain failure. authority must be the source account's owner, or its
        delegate for no more than the delegated amount.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Transfer parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.TransferCheckedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.TransferCheckedResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Move a balance between two token accounts of the same mint
      tags:
      - transaction
  /svm/v2/transaction/token/transfer-to-wallet:
    post:
      consumes:
      - application/json
      description: 'Derives both sides'' associated token accounts from account and
        destination and transfers between them, prepending an idempotent create for
        the destination when it does not exist yet. Both fields are wallet addresses,
        not token accounts, which is the whole reason this endpoint exists rather
        than being transfer-checked with a flag: neither side computes an associated
        address first. The source''s associated account is never created, since an
        account nobody has funded has nothing to send. decimals is checked against
        the mint rather than filled in from it, catching a client that formatted amount
        against the wrong decimals as a 400 instead of an on-chain failure. authority
        must be account''s associated account owner, or its delegate for no more than
        the delegated amount.'
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Transfer parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.TransferToWalletRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.TransferToWalletResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Move a balance between the associated token accounts of two wallets
      tags:
      - transaction
