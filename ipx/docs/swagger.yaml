  /svm/v2/transaction/token/unwrap-lamports:
    post:
      consumes:
      - application/json
      description: 'Unlike close-account, source_token_account is never consumed:
        it stays exactly as it was, still rent-exempt and still wrapping whatever
        is left — the partial counterpart to closing a wrapped-SOL account entirely.
        The instruction''s amount is an optional u64 with a one-byte tag, not the
        4-byte COption tag older instructions use; this endpoint always sends it present,
        and unwrap-lamports/max always sends it absent. amount must not exceed the
        wrapped balance. source_token_account_authority must be its owner, or its
        delegate for no more than the delegated amount — spending wrapped SOL out
        as raw lamports is a spend, not a close, the same axis transfer-checked and
        burn-checked use rather than close-account''s close_authority.unwrap_or(owner).
        source_token_account must already exist, be owned by program, and actually
        be a wrapped-SOL account. destination_token_account receives the unwrapped
        lamports directly as SOL, not tokens; it need not be a token account at all.
        recent_blockhash is always required and is never fetched server-side. Left
        alone, it also builds the message and expires whenever the runtime says it
        does. Naming durable_nonce_account builds the message against the value that
        account stores instead, so the transaction never expires, and prepends the
        advance that consumes it; recent_blockhash then only prices the transaction.
        The response reports nonce_authority in that case, which has to sign as well.'
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Unwrap-lamports parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.UnwrapLamportsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.UnwrapLamportsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Pull exactly amount lamports out of a wrapped-SOL account without closing
        it
      tags:
      - v2-transaction-token-token-account
  /svm/v2/transaction/token/unwrap-lamports/max:
    post:
      consumes:
      - application/json
      description: Same as unwrap-lamports, except the instruction's amount goes out
        absent, which the program reads as the whole wrapped balance. source_token_account
        is left holding exactly its rent-exempt reserve, still initialized and still
        wrapped SOL, ready to be funded again — which is what separates this from
        close-account. source_token_account_authority must be its owner, or its delegate
        approved for at least the whole balance. estimated_amount in the response
        is the wrapped balance at read time; the program computes the real figure
        when this lands. source_token_account must already exist, be owned by program,
        and actually be a wrapped-SOL account. destination_token_account receives
        the unwrapped lamports directly as SOL, not tokens; it need not be a token
        account at all. recent_blockhash is always required and is never fetched server-side.
        Left alone, it also builds the message and expires whenever the runtime says
        it does. Naming durable_nonce_account builds the message against the value
        that account stores instead, so the transaction never expires, and prepends
        the advance that consumes it; recent_blockhash then only prices the transaction.
        The response reports nonce_authority in that case, which has to sign as well.
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Unwrap-lamports parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.UnwrapLamportsMaxRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.UnwrapLamportsMaxResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Pull a wrapped-SOL account's entire balance out as lamports without
        closing it
      tags:
      - v2-transaction-token-token-account
  /svm/v2/transaction/token/withdraw-excess-lamports:
    post:
      consumes:
      - application/json
      description: 'Recovers whatever lamports account holds beyond its own rent-exemption
        minimum, to destination. Unlike close-account, account is never consumed —
        it stays exactly as it was, rent-exempt and still carrying whatever mint,
        token, or multisig state it held. This is for the ordinary way an account
        ends up overfunded: a plain System transfer landing on it by mistake, since
        System''s own Transfer takes any account regardless of who owns it. Which
        role authority actually has to be depends on what account is (a mint''s close
        authority extension, a token account''s close_authority.unwrap_or(owner),
        or a multisig''s own enrolled signers) and this endpoint has no Token-2022
        extension parser to settle that ahead of time, so a wrong authority fails
        on chain rather than as a 400. estimated_recovered in the response is exactly
        that — an estimate computed from account''s balance and size at read time,
        not the value the program itself will use, which is computed fresh at landing
        time. This opcode is unverified: confirm it exists on the deployed program
        before relying on it. recent_blockhash is always required and is never fetched
        server-side. Left alone, it also builds the message and expires whenever the
        runtime says it does. Naming durable_nonce_account builds the message against
        the value that account stores instead, so the transaction never expires, and
        prepends the advance that consumes it; recent_blockhash then only prices the
        transaction. The response reports nonce_authority in that case, which has
        to sign as well.'
      parameters:
      - description: Cluster name
        in: header
        name: X-Chain-Name
        required: true
        type: string
      - description: Cluster network
        in: header
        name: X-Chain-Network
        required: true
        type: string
      - description: Withdraw-excess-lamports parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v2.WithdrawExcessLamportsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v2.WithdrawExcessLamportsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Recover a Token-owned account's excess lamports above its rent-exemption
        minimum
      tags:
      - v2-transaction-token-token-account
