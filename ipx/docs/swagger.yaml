      public_key:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
    type: object
  v1.BuildTransactionRequest:
    properties:
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      instructions:
        items:
          $ref: '#/definitions/v1.Instruction'
        type: array
      recent_blockhash:
        description: |-
          RecentBlockhash may be left empty, in which case it is fetched from the
          cluster. Supplying it makes the call deterministic, which is what allows
          the same request to reproduce identical bytes.
        example: ""
        type: string
    type: object
  v1.BuildTransactionResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      header:
        $ref: '#/definitions/v1.Header'
      message:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      size:
        type: integer
      transaction:
        type: string
    type: object
  v1.Header:
    properties:
      num_readonly_signed_accounts:
        type: integer
      num_readonly_unsigned_accounts:
        type: integer
      num_required_signatures:
        type: integer
    type: object
  v1.Instruction:
    properties:
      accounts:
        items:
          $ref: '#/definitions/v1.Account'
        type: array
      data:
        example: AgAAAECcAAAAAAAA
        type: string
      program_id:
        example: "11111111111111111111111111111111"
        type: string
    type: object
  v2.BurnCheckedRequest:
    properties:
      account:
        example: ""
        type: string
      amount:
        example: "1000"
        type: string
      authority:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      decimals:
        example: 6
        type: integer
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      mint:
        example: ""
        type: string
      multisig_signers:
        description: |-
          MultisigSigners is empty for a single-signer authority. Non-empty, the
          authority itself does not sign; the named members do, in its place.
        items:
          type: string
        type: array
      nonce_account:
        example: ""
        type: string
      program:
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
    type: object
  v2.BurnCheckedResponse:
    properties:
      account:
        type: string
      account_keys:
        items:
          type: string
        type: array
      amount:
        type: string
      authority:
        type: string
      decimals:
        type: integer
      fee:
        type: string
      message:
        type: string
      mint:
        type: string
      nonce_authority:
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
  v2.CloseAccountRequest:
    properties:
      account:
        example: ""
        type: string
      authority:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      destination:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      multisig_signers:
        description: |-
          MultisigSigners is empty for a single-signer authority. Non-empty, the
          authority itself does not sign; the named members do, in its place.
        items:
          type: string
        type: array
      nonce_account:
        example: ""
        type: string
      program:
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
    type: object
  v2.CloseAccountResponse:
    properties:
      account:
        type: string
      account_keys:
        items:
          type: string
        type: array
      authority:
        type: string
      destination:
        type: string
      fee:
        type: string
      message:
        type: string
      nonce_authority:
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      reclaimed_lamports:
        description: |-
          ReclaimedLamports is the account's balance at the moment it was read,
          which is what closing hands to destination. It can change between this
          response and the transaction landing if anything else touches the
          account first.
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
  v2.CreateATAIdempotentRequest:
    properties:
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      mint:
        example: ""
        type: string
      nonce_account:
        example: ""
        type: string
      program:
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
      rent_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      wallet:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
    type: object
  v2.CreateATAIdempotentResponse:
    properties:
      account:
        type: string
      account_keys:
        items:
          type: string
        type: array
      bump:
        type: integer
      fee:
        type: string
      message:
        type: string
      mint:
        type: string
      nonce_authority:
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      rent_exempt:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
      wallet:
        type: string
    type: object
  v2.CreateATARequest:
    properties:
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      mint:
        example: ""
        type: string
      nonce_account:
        example: ""
        type: string
      program:
        description: |-
          Program is a seed of the derived address, not only the program the
          account belongs to, so one wallet has a different associated account
          for classic Token than for Token-2022 over the same mint.
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
      rent_payer:
        description: |-
          RentPayer covers the rent-exemption deposit, distinct from FeePayer:
          the two are separate balances to check, and a caller funding somebody
          else's associated account pays this one without necessarily paying the
          transaction fee.
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      wallet:
        description: |-
          Wallet is who ends up owning the account, which need not be RentPayer.
          Funding somebody else's associated account is ordinary: the address is
          theirs either way.
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
    type: object
  v2.CreateATAResponse:
    properties:
      account:
        type: string
      account_keys:
        items:
          type: string
        type: array
      bump:
        type: integer
      fee:
        type: string
      message:
        type: string
      mint:
        type: string
      nonce_authority:
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      rent_exempt:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
      wallet:
        type: string
    type: object
  v2.CreateAccountRequest:
    properties:
      account:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      from:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      mint:
        example: ""
        type: string
      nonce_account:
        example: ""
        type: string
      owner:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      program:
        description: |-
          Program names the account to send the instructions to: classic Token
          or Token-2022. It is required rather than defaulted, since a token
          account belongs to exactly one of the two forever, and it must agree
          with the mint's own owning program or the instruction fails on chain.
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
    type: object
  v2.CreateAccountResponse:
    properties:
      account:
        type: string
      account_keys:
        items:
          type: string
        type: array
      fee:
        type: string
      message:
        type: string
      mint:
        type: string
      nonce_authority:
        type: string
      owner:
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      rent_exempt:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
  v2.CreateMintRequest:
    properties:
      decimals:
        example: 6
        type: integer
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      freeze_authority:
        example: ""
        type: string
      from:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      mint:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
      mint_authority:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      nonce_account:
        description: |-
          NonceAccount may be left empty, in which case a recent blockhash is
          fetched and the transaction expires with it. Naming one builds against
          the value that account stores instead, so the transaction never
          expires.
        example: ""
        type: string
      program:
        description: |-
          Program names the account to send the instructions to: classic Token
          or Token-2022. It is required rather than defaulted, since a mint
          belongs to exactly one of the two forever and defaulting would make
          picking wrong silent. It is an address rather than a name because that
          is what actually selects the program on chain: Token-2022 is not an
          enum value, it is a different account, and a third Token
          implementation would need no change here to be reachable.
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
    type: object
  v2.CreateMintResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      decimals:
        type: integer
      fee:
        type: string
      freeze_authority:
        type: string
      message:
        type: string
      mint:
        type: string
      mint_authority:
        type: string
      nonce_authority:
        description: |-
          NonceAuthority is present only when the transaction was built against a
          durable nonce, so it doubles as the signal that RecentBlockhash carries
          a stored value rather than a fetched blockhash.
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      rent_exempt:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
  v2.MintToCheckedRequest:
    properties:
      amount:
        example: "1000000"
        type: string
      authority:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      decimals:
        example: 6
        type: integer
      destination:
        example: ""
        type: string
      fee_payer:
        example: EodYvwsT22JTdNmvCeC974WjPiVYcxvfGpYLJxnB3JqK
        type: string
      mint:
        example: ""
        type: string
      multisig_signers:
        description: |-
          MultisigSigners is empty for a single-signer authority. Non-empty, the
          authority itself does not sign; the named members do, in its place.
        items:
          type: string
        type: array
      nonce_account:
        example: ""
        type: string
      program:
        example: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
        type: string
    type: object
  v2.MintToCheckedResponse:
    properties:
      account_keys:
        items:
          type: string
        type: array
      amount:
        type: string
      authority:
        type: string
      decimals:
        type: integer
      destination:
        type: string
      fee:
        type: string
      message:
        type: string
      mint:
        type: string
      nonce_authority:
        type: string
      program:
        type: string
      recent_blockhash:
        type: string
      signers:
        items:
          type: string
        type: array
      transaction:
        type: string
    type: object
  v2.SystemAllocateRequest:
    properties:
      account:
        example: Cc81es6UdN5EwjE27Pv4ZFaQhd6yh4XG5n11SNd8pmxo
        type: string
      fee_payer:
